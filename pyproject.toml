[project]
name = "sample-lineage-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "jsonschema>=4.26.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "simpy==4.1.2",
]

[tool.pytest.ini_options]
# The acceptance tests of the second implementation (tests/user_track/; written by AI clean-room under ADR-0022) are non-blocking: run them with `uv run pytest -m user_track`.
markers = [
    "user_track: acceptance tests for the second implementation (reference/simpy/sim_core.py, reference/sql/), written by AI clean-room under ADR-0022; skipped while those files are absent",
]
addopts = "-m 'not user_track'"
