# Data dictionary (data_model.md section 9; S2d, Step 9). One entry per column that the recorders, the validation rules, the review step and the export emit today, the hidden truth-side fields
# that no recorder may see, the state machines of data_model section 6 with the role allowed to cause each transition, and the roles. Synthetic data only.
#
# Column attributes: name, type (string, integer, number, boolean, array, object), nullable, unit (a UCUM code, or null; `unit_by` names the column or master data that decides the unit),
# values (the allowed values as a list, a {min, max} range, or null), time (valid, transaction or neither: data_model section 5), visibility (observable, or hidden truth that no recorder
# or export may carry), default (null, or {value, ledger}), description. A time column holds integer seconds of the scenario (the engine has no calendar before the raw layer), unit `s`.
# A column an architecture cannot know is null (data_model principle 7): `nullable: true` says it may be null in some architecture, the description says which.
#
# Tests: tests/test_data_dictionary.py reads this file and the output of engine/tests/support/dictionary_cli.ts (the recorders run on hand-built streams under every architecture and on the
# default scenario at the small size): every emitted column is here with its type and nullability, every state emitted belongs to its machine, every transition performed is listed with a
# role that may cause it, the transition table equals the one in engine/src/record/transitions.ts, and no hidden column appears in any recorded or exported output.
# The raw device layer (data_model section 16) is described in two steps: the analyzer side since S2e1 (adapter, raw_file, raw_record, parse_error and the new columns of result) and the controller
# side since S2e2 (historian_value with its layer-on columns, alarm_event, batch_phase_record and their state machines). `raw_layer` at the end lists the columns of section 16.2 that no run
# emits yet; it is a marked placeholder for them, not an entry.
# The break-out extension (data_model sections 15.1, 15.2 and 15.6; break-out batch 3) adds the entities material_lot, equipment, lineage_edge and deviation, the columns purpose, outcome, seed_lot_id, lot_id and
# equipment_id of the earlier tables, the confirming tests as master data and the machines of 15.2. They exist in a dataset only when the recorder was given the master data of a scenario with a break-out block
# (absent, not null, otherwise). Break-out batch 4 adds the investigation, a step after recording on the recorded side: it places the rows of quality_hold, gives the deviation its estimated onset, assumed
# lag and closing, moves lots and equipment items into on_hold and quarantined, and writes the retro-flag versions of data_model 15.3 (result.hold_id and the hold, person and reason on the audit event of
# a flag). Break-out batch 5 adds the mycoplasma confirming tests (A144 to A146) to the master data. The CLI records FX12a, FX12e and FX12m under the thirteen configurations and investigates them.

dictionary_version: "1"
data_model: docs/design/data_model.md
schema_version: "1"

# ---- roles (data_model section 6) ----------------------------------------------------------------------------------------------------------------------------------------------------
roles:
  sampler: {kind: person, description: "draws the sample from the process (data_model section 6, planned -> drawn)"}
  analyst: {kind: person, description: "receives the sample at the analyzer bench and works on it (in_transit -> received)"}
  reviewer: {kind: person, description: "resolves a held or quarantined row and rejects (value kept) or discards"}
  approver: {kind: person, description: "releases a result (under_review -> released)"}
  administrator: {kind: person, description: "master data only; causes no transition of a sample or a result"}
  rule: {kind: automatic, description: "an actor that no person causes: the import of an instrument result, a validation rule (data_model section 8) or the volume budget (VR-016). Not one of the five roles of section 6; added by S2d for the steps the diagram draws without a person"}

# ---- master data: analytes and their canonical UCUM units (data_model section 9) -----------------------------------------------------------------------------------------------------
analytes:
  vcd: {unit: "10*6/mL", ledger: A007, description: "viable cell density, 1e6 cells per mL"}
  viability: {unit: "%", ledger: A211, description: "viability in percent"}
  glucose: {unit: "g/L", ledger: A190, description: "glucose"}
  glutamine: {unit: "mmol/L", ledger: A191, description: "glutamine, mM in the profile settings"}
  lactate: {unit: "g/L", ledger: A209, description: "lactate"}
  titer: {unit: "g/L", ledger: A210, description: "product titer"}
  ph: {unit: "[pH]", ledger: A198, description: "pH on its scale"}

# ---- master data: the confirming tests of the break-out events (data_model 15.1, method kind). A confirming result carries the test in its `analyte` column and an outcome instead of a value ------------
confirming_tests:
  bioburden: {ledger: A142, description: "bioburden (plate count), asked of a confirming sample after a signal"}
  sterility: {ledger: A143, description: "sterility, two media (A148)"}
  mycoplasma_culture: {ledger: A144, description: "mycoplasma, culture method (28 d); a negative result needs the full period"}
  mycoplasma_indicator_cells: {ledger: A145, description: "mycoplasma, indicator cell method (8 d)"}
  nucleic_acid_test: {ledger: A146, description: "nucleic-acid test (1 d); sequence-specific, it reports an organism only when the scenario marks its target as covering it (input A224)"}

# ---- the recorded dataset (engine/src/record/types.ts) -----------------------------------------------------------------------------------------------------------------------------
dataset:
  tables: [sample, analysis_request, run, instrument_state, result, audit_event, qualification, source_event, validation_finding, ingest_conflict, batch, process_event, material_lot, equipment, lineage_edge, deviation, quality_hold]
  other: {architecture: "id, the ten flags and labelling of the architecture that recorded the dataset (spec section 5; material_lot_links and equipment_links, ADR-0017 and ADR-0020, are read only with a break-out event, so a dataset without one is the same with either on or off). The five break-out tables (material_lot, equipment, lineage_edge, deviation, quality_hold) are members of a dataset only when the recorder was given the master data of a scenario with a break-out block; without it they are absent, not empty", historian: "series (entity historian_series) and late rows (entity historian_value)", capture: "raw layer only: the capture path of the dataset ({path}); absent with the layer off", raw: "adapter_ingest only: the raw-side tables adapter, raw_file, raw_record and parse_error (data_model section 16.1) and, with a controller on a bay, the controller records alarm_event and batch_phase_record (section 16.4)"}

entities:
  sample:
    emitted: true
    description: "one physical draw (data_model section 2); recorder rows, with the keys of write_time_keys and the times of two_clocks"
    columns:
      - {name: sample_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key of the sample; stored by every architecture"}
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit (vessel) as carried by the label in the stream; stored at write by every architecture"}
      - {name: batch_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "write_time_keys only: fixed at write; null otherwise and derived at read by a time join (data_model section 7, Keys)"}
      - {name: keys_fixed_at_write, type: boolean, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "true when write_time_keys fixed the keys at write time"}
      - {name: state, type: string, nullable: true, unit: null, values: [planned, drawn, in_transit, received, aliquoted, closed, quarantined, discarded, skipped], time: neither, visibility: observable, default: null, description: "state of the sample machine (state_machines.sample). The recorder emits only skipped (a draw the volume budget refused, VR-016); null means the recorder does not model the state (data_model section 7, S2a)"}
      - {name: sampled_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "two_clocks only (K3): the instant the sample left the process; null otherwise and for a skipped draw"}
      - {name: planned_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "system_issued_id only: the time the sampling plan gave the sample"}
      - {name: operator_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only: the sampler (pseudonymous id)"}
      - {name: qualification_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only: the qualification record of the sampler valid at the draw; null when none was (VR-015)"}
      - {name: label_method, type: string, nullable: true, unit: null, values: [handwritten, preprinted_barcode, issued_at_draw], time: neither, visibility: observable, default: null, description: "the labelling method the label_bound event reports; null for a skipped draw"}
      - {name: container, type: string, nullable: true, unit: null, values: [open, closed], time: neither, visibility: observable, default: null, description: "the container the plan records (an L2 setting); null when the plan names none (data_model section 7, S2c1)"}
  analysis_request:
    emitted: true
    description: "one analysis request as the plan records it; the other columns of data_model section 2 are not modelled yet"
    columns:
      - {name: request_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key; equal to the sample id in this engine (one request per sample)"}
      - {name: control_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "shared by the requests that measure one bridging material; null for an ordinary request"}
      - {name: purpose, type: string, nullable: false, unit: null, values: [routine, confirmatory], time: neither, visibility: observable, default: null, description: "break-out only (data_model 15.1): a confirmatory request is a confirming test asked of a confirming sample, one request per sample (the request id is the sample id) with one result per test; the validation rules and the section 8 metrics count routine requests only (spec 11.8.2 rule S10). Absent without a break-out block"}
  run:
    emitted: true
    description: "one pass of a sample through an instrument (data_model section 2)"
    columns:
      - {name: run_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: request, attempt and visit"}
      - {name: request_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the request the run served"}
      - {name: attempt, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "1 for the first run, higher for a rerun"}
      - {name: visit, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "the visit on the route of the request (one per analyzer of a split profile); for a confirming sample, the position of the test among its tests (one run per test)"}
      - {name: analyzer_name, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the analyzer as free text, as seen on the event; stored whatever instrument_state_snapshot says. A confirming test runs on `external_lab` (data_model 15.1), which has no instrument link"}
      - {name: instrument_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "instrument_state_snapshot only"}
      - {name: instrument_state_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "instrument_state_snapshot only: the state valid at the run start"}
      - {name: started_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the instant the run began, after any setup (run_started_at, data_model section 5)"}
      - {name: ended_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the instant the run ended; null while no visit_finished has been seen"}
      - {name: qc_outcome, type: string, nullable: true, unit: null, values: [qc_passed, qc_failed, over_range, over_range_unresolved], time: neither, visibility: observable, default: null, description: "the outcome of the qc_result event of the run; held by every architecture (no flag owns it); null while none has been seen; over_range_unresolved ends a visit still above the range at the last dilution (simulation_spec 2.3)"}
  instrument_state:
    emitted: true
    description: "one versioned state of an instrument (a calibration record opens it); instrument_state_snapshot only"
    columns:
      - {name: instrument_state_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: analyzer and calibration instant"}
      - {name: instrument_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the analyzer"}
      - {name: calibration_ref, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "reference of the calibration record that opened the state"}
      - {name: reagent_lot, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the reagent lot of the calibration record"}
      - {name: valid_from, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the calibration instant"}
      - {name: valid_to, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the next calibration of the same analyzer; null while the state is the latest"}
  result:
    emitted: true
    description: "one analyte value of a request, one version (data_model section 2, K1); recorder rows, then the validation rules and the review step set state, reviewed_at and available_at"
    columns:
      - {name: result_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key of the row"}
      - {name: request_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the request, under the id the record holds its results by (a label error moves it)"}
      - {name: analyte, type: string, nullable: false, unit: null, values: [vcd, viability, glucose, glutamine, lactate, titer, ph, bioburden, sterility, mycoplasma_culture, mycoplasma_indicator_cells, nucleic_acid_test], time: neither, visibility: observable, default: null, description: "analyte code; its unit is in the master data `analytes`. For a confirming result (break-out only) the test that was run, from the master data `confirming_tests`; it has no unit"}
      - {name: version, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "rank of the attempt among the attempts recorded for (request, analyte); an overwrite in place keeps 1"}
      - {name: run_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "K2: a result cannot exist without a run"}
      - {name: value, type: number, nullable: true, unit: null, unit_by: analyte, values: null, time: neither, visibility: observable, default: null, description: "the value in the canonical unit of its analyte (the engine works in the canonical units until the raw layer keeps an original unit); null on a confirming result, which carries an outcome instead (K18), and on every result of a run whose QC outcome is over_range_unresolved (simulation_spec 2.3)"}
      - {name: measured_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "K2: the instant the measurement ended; a wrong instrument clock makes it wrong in the record (A049); for a confirming test the read-out, the draw plus the turnaround (A142, A143)"}
      - {name: available_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "available_at only: when this version became knowable; a released row has the review point; a rejected row has none"}
      - {name: supersedes, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "append_only_versions only: the result_id this version replaces"}
      - {name: ingested_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the instant the system wrote the row; null in architecture A, where no system writes the rows (data_model section 7)"}
      - {name: reviewed_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the instant a reviewer acted (review point); null for a row that was never held. Time class chosen by S2d: the section 5 table leaves it open"}
      - {name: state, type: string, nullable: true, unit: null, values: [measured, held, quarantined, rejected, under_review, released, superseded], time: neither, visibility: observable, default: null, description: "state of the result machine (state_machines.result). Null is the initial state measured: no transition has acted. The recorder and the review emit held, quarantined, rejected and released"}
      - {name: capture_path, type: string, nullable: false, unit: null, values: [manual_transcription, adapter_ingest], time: neither, visibility: observable, default: null, description: "raw layer only (data_model section 16.2, K23): how the result became a record; absent with the layer off"}
      - {name: entered_by, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "raw layer only: the operator who typed the result; set only on manual_transcription and only with audit_trail on (K23), null otherwise"}
      - {name: raw_ref, type: object, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "raw layer only: {raw_file_id, line_no} of the line the row was loaded from; set only on adapter_ingest (K20, K23)"}
      - {name: unit_original, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "raw layer only (K11): the unit text of the file or of the typed entry; null when the file carries none and the entry's unit applied"}
      - {name: unit_ucum, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "raw layer only: the UCUM code of the unit the row was read or typed in (VR-005 compares its dimension with the analyte's)"}
      - {name: dilution_factor, type: number, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: {value: 1, ledger: A090}, description: "raw layer only: the dilution ratio of the file or of the typed entry; null when it was left out (VR-013 on a typed entry)"}
      - {name: time_resolution_s, type: integer, nullable: true, unit: s, values: {min: 1}, time: neither, visibility: observable, default: null, description: "raw layer only: the resolution of the stamp the row was read from (one minute for the counter dialect, A166); null on a typed entry"}
      - {name: outcome, type: string, nullable: true, unit: null, values: [detected, not_detected], time: neither, visibility: observable, default: null, description: "break-out only (data_model 15.1, K18): what a confirming test found; set exactly on the results of confirmatory requests, null on a routine result. The tests report the truth, except that the nucleic-acid test finds only what its target covers (A146). Absent without a break-out block"}
      - {name: hold_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out retro-flag only (data_model 15.3 item 3, K16): set on version n+1 of a released result that a hold covers, naming the quality_hold. Absent, not null, on every other row, so a run without a retro-flag has no such column; version n is never modified"}
  audit_event:
    emitted: true
    description: "audit_trail only: one row per change of a result (a rerun that replaces an earlier attempt); data_model section 2, supporting entities"
    columns:
      - {name: audit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: request_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the request of the changed result"}
      - {name: analyte, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the analyte of the changed result"}
      - {name: at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "when the change was recorded (the stamp of the event of the new attempt). Time class chosen by S2d"}
      - {name: old_value, type: number, nullable: true, unit: null, unit_by: analyte, values: null, time: neither, visibility: observable, default: null, description: "the value before the change; null where that version has no value (over_range_unresolved, simulation_spec 2.3)"}
      - {name: new_value, type: number, nullable: true, unit: null, unit_by: analyte, values: null, time: neither, visibility: observable, default: null, description: "the value after the change; null where the new version has no value (over_range_unresolved, simulation_spec 2.3)"}
      - {name: old_version, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "version before"}
      - {name: new_version, type: integer, nullable: false, unit: null, values: {min: 2}, time: neither, visibility: observable, default: null, description: "version after"}
      - {name: hold_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out retro-flag only (data_model 15.3 item 3): the hold that caused the flag. Absent, not null, on the audit event of a rerun"}
      - {name: placed_by, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out retro-flag only: the role that placed the hold (reviewer). VR-022 is evaluable only with audit_trail on, so the person is always stored on the audit event of a flag; absent on a rerun"}
      - {name: reason, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out retro-flag only: the reason of the hold, the direction and the path that reached the result (rule S9). Always stored, for the same reason as placed_by; absent on a rerun"}
  qualification:
    emitted: true
    description: "audit_trail only: the qualification records given to the recorder (plain data from the assembly)"
    columns:
      - {name: qualification_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: operator_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the operator the record attests"}
      - {name: qualified, type: boolean, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the recorded training status (the level of A072 and A073 as a boolean); the truth-side counterpart is truth_operator.qualified"}
      - {name: valid_from, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "start of validity"}
      - {name: valid_to, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "end of validity; null while the qualification has no end"}
  source_event:
    emitted: true
    description: "ingest_idempotency only: one row per distinct idempotency key (K9); the ingestion envelope of data_model section 7"
    columns:
      - {name: source_system, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the instrument that produced the record"}
      - {name: source_event_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the source's own id: analyzer, request, attempt, visit and analyte"}
      - {name: idempotency_key, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "source, event id and content version"}
      - {name: received_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the envelope received_at; becomes ingested_at"}
  validation_finding:
    emitted: true
    description: "one finding of a validation rule (data_model section 8); a rule changes a state and never a value"
    columns:
      - {name: rule, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "rule id (VR-002 ... VR-026, VR-008b)"}
      - {name: target, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "result:<result_id>, sample:<sample_id>, source_event:<source_event_id> or, raw layer, file:<raw_file_id>; break-out, VR-021: process_event:<event_id> or batch:<batch_id> (a finding on one of these changes no row, so the review does not see it)"}
      - {name: severity, type: string, nullable: false, unit: null, values: [info, warning, error], time: neither, visibility: observable, default: null, description: "severity of the rule"}
      - {name: action, type: string, nullable: false, unit: null, values: [no-op, hold, quarantine, reject], time: neither, visibility: observable, default: null, description: "the action of the rule; a no-op is the harmless replay (VR-008)"}
      - {name: status, type: string, nullable: false, unit: null, values: [open, resolved], time: neither, visibility: observable, default: null, description: "state of the finding itself: open until the review resolves it; a no-op is resolved at once"}
  ingest_conflict:
    emitted: true
    description: "ingest_idempotency only: an incoming row with a known idempotency key and other content; not loaded, the original stays (VR-008b)"
    columns:
      - {name: source_system, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "as source_event"}
      - {name: source_event_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "as source_event"}
      - {name: idempotency_key, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "as source_event"}
      - {name: received_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "as source_event"}
      - {name: request_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the request of the incoming row"}
      - {name: analyte, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the analyte of the incoming row"}
      - {name: run_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the run of the incoming row"}
      - {name: value, type: number, nullable: false, unit: null, unit_by: analyte, values: null, time: neither, visibility: observable, default: null, description: "the conflicting value"}
      - {name: measured_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the measurement instant of the incoming row"}
  adapter:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model section 16.1): one adapter version, a dialect plus what the parser believes about one device; a synthetic format modeled on public documentation, never a claim about a real instrument (ADR-0014)"
    columns:
      - {name: adapter_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key with adapter_version: dialect and instrument"}
      - {name: adapter_version, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "immutable once a file was parsed with it (K21)"}
      - {name: dialect_id, type: string, nullable: false, unit: null, values: [allinone_csv, counter_csv, cds_table, ctrl_neutral, ctrl_bench], time: neither, visibility: observable, default: null, description: "the dialect (data/scenarios/profiles/dialect/) or the controller family (data/scenarios/profiles/controller/); the engine never branches on it"}
      - {name: device_class, type: string, nullable: false, unit: null, values: [analyzer, controller], time: neither, visibility: observable, default: null, description: "an analyzer dialect, or a controller family (S2e2: one adapter per controller, one controller per bay)"}
      - {name: instrument_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the instrument whose files the adapter reads (the source system of everything loaded)"}
      - {name: date_order, type: string, nullable: false, unit: null, values: [year_first, day_first, month_first, unknown], time: neither, visibility: observable, default: null, description: "what the parser believes about the order of the stamp (RQ2); unknown lets one row of a file pin it"}
      - {name: date_separator, type: string, nullable: false, unit: null, values: ["-", "/", "."], time: neither, visibility: observable, default: null, description: "the separator of the stamp date"}
      - {name: clock_style, type: string, nullable: false, unit: null, values: ["24h", "12h", unknown], time: neither, visibility: observable, default: null, description: "24 h, or 12 h whose day-part marker the file may lack (RQ2)"}
      - {name: source_zone_s, type: integer, nullable: true, unit: s, values: null, time: neither, visibility: observable, default: null, description: "the zone the adapter applies, seconds ahead of UTC; null leaves every stamp unresolved (VR-024, RQ1)"}
      - {name: stamp_means, type: string, nullable: false, unit: null, values: [start, end, instant], time: neither, visibility: observable, default: null, description: "whether the row stamp is the start or the end of the run (spec 2.4.8: the default, end, is an assumption); instant for a controller row, which is not a run"}
      - {name: time_resolution_s, type: integer, nullable: false, unit: s, values: {min: 1}, time: neither, visibility: observable, default: null, description: "the resolution of the stamp (one minute for the counter dialect, A166)"}
      - {name: modeled_on, type: array, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the S### ledger ids the dialect is modeled on"}
      - {name: banner, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the first line of every file of the dialect: synthetic, modeled on public documentation; not a real instrument file (ADR-0014 R3)"}
  raw_file:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model section 16.1): one received file; append-only (K19), the same content received twice is two rows with one content_hash"
    columns:
      - {name: raw_file_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: adapter_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the adapter the file was parsed with"}
      - {name: adapter_version, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "its version"}
      - {name: file_name, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "vendor-neutral prefix, the instrument and the export time (A159)"}
      - {name: content_hash, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "hash of the content; a replayed file has the hash of the first"}
      - {name: row_count, type: integer, nullable: false, unit: null, values: {min: 0}, time: neither, visibility: observable, default: null, description: "data lines in the file, repeated rows included"}
      - {name: received_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the host clock when the file arrived; the ingested_at of everything loaded from it"}
      - {name: instrument_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the instrument that wrote the file"}
      - {name: state, type: string, nullable: false, unit: null, values: [received, parsed, rejected], time: neither, visibility: observable, default: null, description: "a file with a required column missing is rejected as a whole (VR-023)"}
  raw_record:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model section 16.1): one data line of a raw file, with the outcome of the parser; append-only and immutable (K19)"
    columns:
      - {name: raw_record_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: file and line"}
      - {name: raw_file_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the file"}
      - {name: line_no, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "the physical line, banner included"}
      - {name: record_kind, type: string, nullable: false, unit: null, values: [analysis, injection, tag_value, alarm_transition, phase_transition], time: neither, visibility: observable, default: null, description: "one analysis of a sample, one injection of a data system, or (S2e2) one tag value, alarm transition or phase transition of a controller log"}
      - {name: raw_text, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the line as received"}
      - {name: source_event_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the dialect's natural key of the line (instrument, row stamp text and sample id, or injection and result id), with the analyte; null for a rejected line"}
      - {name: state, type: string, nullable: false, unit: null, values: [loaded, no_op, held, quarantined, rejected], time: neither, visibility: observable, default: null, description: "the outcome per line; the worst state of the results of the line, no_op when every result was a repeat"}
      - {name: rule_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the rule behind a state other than loaded (VR-005, VR-006, VR-008, VR-008b, VR-019, VR-023 to VR-026)"}
  parse_error:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model section 16.1): one dead-lettered line or file (VR-023); every rejected raw_record has exactly one (K20)"
    columns:
      - {name: parse_error_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: raw_file_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the file"}
      - {name: line_no, type: integer, nullable: true, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "the line; null for a file-level error"}
      - {name: column_role, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the raw role the error concerns, where there is one"}
      - {name: code, type: string, nullable: false, unit: null, values: [unknown_dialect_or_template, required_column_missing, bad_row_width, malformed_stamp, non_numeric_value, unknown_unit, unknown_name], time: neither, visibility: observable, default: null, description: "why the line or file could not be read (data_model section 16.1); unknown_name (S2e2): a tag, alarm or phase name, or a state, that the adapter maps do not know"}
      - {name: rule_id, type: string, nullable: false, unit: null, values: [VR-023], time: neither, visibility: observable, default: null, description: "the rule: VR-023 rejects"}
      - {name: reason, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the reason in words"}
      - {name: raised_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the file's received_at"}
  batch:
    emitted: true
    description: "one culture run on a unit (data_model section 2)"
    columns:
      - {name: batch_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit that hosts the batch"}
      - {name: inoculated_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the instant of the inoculation event"}
      - {name: harvested_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the instant of the harvest event; null while the batch is open"}
      - {name: seed_lot_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out only (data_model 15.6, K17): the seed lot of the inoculation, as a key, stored under material_lot_links (with the edge seeded_from); null with the flag off. Absent without a break-out block"}
  process_event:
    emitted: true
    description: "one event in a batch (data_model section 2); ingested at its own stamp"
    columns:
      - {name: event_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: batch_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the batch"}
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit"}
      - {name: kind, type: string, nullable: false, unit: null, values: [feed, temperature_shift, alarm, harvest, medium_addition, equipment_use, unit_stopped], time: neither, visibility: observable, default: null, description: "type of the event; feeds are discrete (A010). medium_addition, equipment_use and unit_stopped (break-out) are recorded by every architecture; the lot and the item they name are stored only under their flag (columns lot_id and equipment_id)"}
      - {name: occurred_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "valid time of the event"}
      - {name: amount, type: number, nullable: true, unit: null, unit_by: kind, unit_map: {feed: L, temperature_shift: Cel}, values: null, time: neither, visibility: observable, default: null, description: "a bolus in litres, a set point in degrees Celsius; null when the event carries none"}
      - {name: source, type: string, nullable: false, unit: null, values: [rule, scheduled, scripted], time: neither, visibility: observable, default: null, description: "what caused the event: a rule, the schedule, or a scripted scenario event"}
      - {name: ingested_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "equal to occurred_at: no ingestion delay is modelled before the raw layer"}
      - {name: lot_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out only (data_model 15.6): the medium lot of a medium_addition, as a key, stored under material_lot_links (with the edge consumed_in); null otherwise. Absent without a break-out block"}
      - {name: equipment_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "break-out only (data_model 15.6, K19): the shared equipment item of an equipment_use, as a key, stored under equipment_links (with the edge used_in); null otherwise. Absent without a break-out block"}
  material_lot:
    emitted: true
    description: "break-out only (data_model 15.1, 15.6): one lot of seed or medium of the scenario topology; stored under material_lot_links for every lot of the topology (the table is empty with the flag off). A lot is a key the plant carries, not a quantity: `quantity` is null in S3"
    columns:
      - {name: lot_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: kind, type: string, nullable: false, unit: null, values: [seed, medium], time: neither, visibility: observable, default: null, description: "seed or medium; kind feed is in the closed list of data_model 15.1 and no scenario uses it (routine feeds carry no lot id in S3)"}
      - {name: cell_line_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "seed lots only, null in S3: the cell line waits for S4 (data_model 15.1)"}
      - {name: prepared_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "when the lot was prepared: master data of the scenario topology"}
      - {name: quantity, type: number, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "null in S3: no ledger entry gives a lot size and nothing reads it"}
      - {name: parent_lot_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "stored and not walked; null in S3 (the N-1 seed train is S4, A155)"}
      - {name: state, type: string, nullable: false, unit: null, values: [prepared, available, in_use, consumed, discarded, on_hold, quarantined], time: neither, visibility: observable, default: null, description: "state of the lot machine (state_machines.material_lot): the recorder registers every lot as available and puts a lot that some event consumed in use; the investigation puts a lot on_hold while a quality_hold covers it and quarantined under a positive result (a quarantine is final in S3). A lot is never left on_hold in a finished run: a hold ends released or as a quarantine"}
  equipment:
    emitted: true
    description: "break-out only (data_model 15.1, 15.6): one shared item of equipment (a transfer line, a connection set, a shared vessel) that more than one unit uses; stored under equipment_links for every item of the topology (the table is empty with the flag off). A unit's own equipment is the unit and has no row"
    columns:
      - {name: equipment_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: name, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the name of the item, master data of the scenario topology"}
      - {name: state, type: string, nullable: false, unit: null, values: [in_service, on_hold, quarantined], time: neither, visibility: observable, default: null, description: "state of the equipment machine (state_machines.equipment): in service; the investigation puts an item on_hold while a quality_hold covers it and quarantined under a positive result. Cleaning and return to service are not modelled (no source)"}
  lineage_edge:
    emitted: true
    description: "break-out only (data_model 15.6): the edges consumed_in and seeded_from under material_lot_links and used_in under equipment_links, written in stream order. No row exists for any other relation in S3. The earlier lineage of the recorded tables is read by key (sample, request, result)"
    columns:
      - {name: edge_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: E1, E2, ... in stream order"}
      - {name: from_kind, type: string, nullable: false, unit: null, values: [material_lot, equipment], time: neither, visibility: observable, default: null, description: "the kind of what the edge starts from (data_model section 14, question 6, for the new rows)"}
      - {name: from_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the lot or equipment item"}
      - {name: to_kind, type: string, nullable: false, unit: null, values: [batch, process_event], time: neither, visibility: observable, default: null, description: "the kind of what the edge ends at: the batch for seeded_from, the process event for consumed_in and used_in"}
      - {name: to_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the batch or process event"}
      - {name: relation, type: string, nullable: false, unit: null, values: [consumed_in, seeded_from, used_in], time: neither, visibility: observable, default: null, description: "consumed_in: lot to the medium_addition, one edge per lot and batch, to the first use; seeded_from: seed lot to the batch, named from the target's side; used_in: equipment item to the equipment_use, one edge per use"}
      - {name: occurred_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the instant of the event the edge records"}
      - {name: available_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "available_at only: the stamp of the event (no ingestion delay is modelled); null otherwise"}
  deviation:
    emitted: true
    description: "break-out only (data_model 15.1, 15.6): one written record of an unplanned event, one per event, opened at the first signal in every architecture. The estimated onset, the assumed lag and the closing are made by the investigation of batch 4 (the first signal minus the assumed lag; closed at the later of the last confirming result and the last end of a hold), so they are null from the recorder and set in an investigated dataset"
    columns:
      - {name: deviation_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: batch_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the batch of the signalling unit (a column the recorder adds to the list of data_model 15.6; the investigation starts from it)"}
      - {name: opened_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the first signal"}
      - {name: opened_by, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only: the role that opened the deviation (reviewer). The stream names no person, so the record holds the role of data_model section 6 and not an identity; null otherwise"}
      - {name: trigger, type: string, nullable: false, unit: null, values: [signal, test_result], time: neither, visibility: observable, default: null, description: "what opened it; only a signal in S3"}
      - {name: estimated_onset, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the signal time minus the assumed lag, a decision setting and not truth; null from the recorder, set by the investigation"}
      - {name: assumed_lag, type: integer, nullable: true, unit: s, values: null, time: neither, visibility: observable, default: null, description: "the lag the investigation assumed, a duration; null from the recorder, set by the investigation"}
      - {name: state, type: string, nullable: false, unit: null, values: [opened, contained, concluded, closed], time: neither, visibility: observable, default: null, description: "state of the deviation machine (state_machines.deviation); the recorder writes opened, the initial state; the investigation contains it at the first hold, concludes it when every confirming result is in and closes it once every hold has ended"}
      - {name: closed_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "null from the recorder; set by the investigation when the deviation is closed"}
      - {name: closed_by, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only (the role reviewer); null from the recorder and without audit_trail"}
      - {name: available_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "available_at only: the stamp of the deviation_opened event"}
  quality_hold:
    emitted: true
    description: "break-out only (data_model 15.1, 15.6): one hold or quarantine placed on one item by the investigation (rule S9: one per item, on the batch, each returned result, each lot, each equipment item and each sibling batch). The recorder writes the table empty and the investigation places the rows. `placed_by`, `released_by` and `reason` are null without audit_trail and `available_at` is stored only with its flag"
    columns:
      - {name: hold_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key"}
      - {name: deviation_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "K15: every hold references a deviation"}
      - {name: target_kind, type: string, nullable: false, unit: null, values: [batch, material_lot, equipment, result], time: neither, visibility: observable, default: null, description: "what the hold covers; a lot target exists only with material_lot_links and an equipment target only with equipment_links (the item is a key)"}
      - {name: target_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the batch, lot, equipment item or result"}
      - {name: kind, type: string, nullable: false, unit: null, values: [hold, quarantine], time: neither, visibility: observable, default: null, description: "a hold, or a quarantine after a positive confirming result (at the result plus d2, A176); named quality_hold so it does not clash with the validation action hold of data_model section 8"}
      - {name: state, type: string, nullable: false, unit: null, values: [placed, under_test, released, quarantined, rejected, closed], time: neither, visibility: observable, default: null, description: "state of the hold machine (state_machines.quality_hold): a hold is placed, put under test and decided at once, so a finished run leaves every hold closed with its deviation"}
      - {name: placed_at, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "valid time of the placement"}
      - {name: placed_by, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only"}
      - {name: reason, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only"}
      - {name: released_at, type: integer, nullable: true, unit: s, values: null, time: valid, visibility: observable, default: null, description: "null while the hold stands; the release instant (the last negative result plus d2) or, for a quarantine, the next review point (A215) at which it is rejected"}
      - {name: released_by, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "audit_trail only"}
      - {name: outcome, type: string, nullable: true, unit: null, values: [released, rejected], time: neither, visibility: observable, default: null, description: "how the hold ended; null while it stands"}
      - {name: available_at, type: integer, nullable: true, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "available_at only"}
  historian_series:
    emitted: true
    description: "the online sensor series kept columnar (about a million values for the default scenario); a tick is the row `<unit>.<signal>`, ts, value, with ingested_at equal to ts"
    columns:
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit whose sensor the series is"}
      - {name: signal, type: string, nullable: false, unit: null, values: [pH, DO, temperature], time: neither, visibility: observable, default: null, description: "the signal; a historian tag is `unit_id.signal` (data_model section 2)"}
      - {name: t0_s, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "the stamp of the first value"}
      - {name: cadence_s, type: integer, nullable: false, unit: s, values: {min: 1}, time: neither, visibility: observable, default: {value: 60, ledger: A100}, description: "seconds between values"}
      - {name: n, type: integer, nullable: false, unit: null, values: {min: 1}, time: neither, visibility: observable, default: null, description: "number of values"}
      - {name: pv, type: array, nullable: false, unit: null, unit_by: signal, unit_map: {pH: "[pH]", DO: "%", temperature: Cel}, values: null, time: neither, visibility: observable, default: null, description: "the process values at t0_s + j * cadence_s (process value only; no truth array)"}
  historian_value:
    emitted: true
    description: "a historian row that arrived later than its valid time (data_model section 5). Empty from a layer-off recorder. With the raw layer on and adapter_ingest, a controller on the bay (S2e2) makes the logged rows the historian of the dataset: one row per logged tag value, never interpolated (RQ9; the value of a tag at a time is the last row at or before it, data_model 16.4)"
    columns:
      - {name: tag, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "`unit_tag.signal` layer off; with the raw layer on the canonical `unit_tag.signal.role` with role PV, SP or OUT (A171, data_model 16.4); both families of controller land in this one form"}
      - {name: ts, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "valid time of the value: the stamp of the logged row"}
      - {name: value, type: number, nullable: false, unit: null, unit_by: tag, values: null, time: neither, visibility: observable, default: null, description: "the value; the unit follows the signal of the tag"}
      - {name: quality, type: string, nullable: false, unit: null, values: [good], time: neither, visibility: observable, default: null, description: "quality flag as the controller wrote it"}
      - {name: ingested_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "when the system received the row: the file received_at on adapter_ingest, which the controller log cut decides (A217: the end of the row day for daily, the row own stamp for per_row)"}
      - {name: raw_ref, type: object, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "raw layer only: the raw file and line the value was parsed from ({raw_file_id, line_no}); null for a row that was not parsed from a file"}
  alarm_event:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model 16.4): one state transition of one alarm instance, as a controller log wrote it (RQ10). Append-only (K22); acknowledge and return-to-normal are separate rows. A transition the alarm model does not allow is stored and held (VR-025): a finding targets alarm_event:<alarm_event_id>. A production run writes none (no acknowledge or return-to-normal time has a ledger entry, spec 2.4.8)"
    columns:
      - {name: alarm_event_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: raw file and line"}
      - {name: alarm_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the alarm instance, with unit_id"}
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit (vessel) the alarm belongs to"}
      - {name: tag, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the process tag the alarm watches, canonical; null where the family alarm log does not carry it"}
      - {name: severity, type: integer, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "OPC UA severity (A174); null where the family log does not carry it"}
      - {name: from_state, type: string, nullable: false, unit: null, values: [normal, unacknowledged, acknowledged, rtn_unacknowledged, shelved, suppressed_by_design, out_of_service], time: neither, visibility: observable, default: null, description: "the state before the transition: written by the family that has a From column, else the previous state of the instance, normal for the first row"}
      - {name: to_state, type: string, nullable: false, unit: null, values: [normal, unacknowledged, acknowledged, rtn_unacknowledged, shelved, suppressed_by_design, out_of_service], time: neither, visibility: observable, default: null, description: "the state after the transition (state_machines.alarm_event)"}
      - {name: ts, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "valid time of the transition"}
      - {name: ingested_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the file received_at"}
      - {name: actor, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the acknowledging user, where the family records one (A174, S099); null otherwise"}
      - {name: comment, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "free text; no family of S2 writes one, so it is always null"}
      - {name: raw_ref, type: object, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the raw file and line ({raw_file_id, line_no}); every row loaded from a file has one (K20)"}
  batch_phase_record:
    emitted: true
    kind: raw_layer
    description: "adapter_ingest only (data_model 16.4): one state transition of one phase instance, as a controller log wrote it (RQ11), with the ISA-88 hierarchy as ids (A170). Append-only (K22). A transition the phase model does not allow is stored and held (VR-025): a finding targets batch_phase_record:<phase_record_id>. The phase log is checked against the batch times, never used to overwrite them"
    columns:
      - {name: phase_record_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "key: raw file and line"}
      - {name: batch_id, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the batch; null where the family phase log does not carry it"}
      - {name: unit_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the unit (vessel)"}
      - {name: recipe_id, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the recipe"}
      - {name: procedure, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "ISA-88 procedure; null where the family log does not carry it"}
      - {name: unit_procedure, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "ISA-88 unit procedure (at most one open per unit, S093); null where the family log does not carry it"}
      - {name: operation, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "ISA-88 operation; null where the family log does not carry it"}
      - {name: phase, type: string, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the phase; the production run writes before_shift and after_shift (data_model section 7, S2e2 table)"}
      - {name: from_state, type: string, nullable: false, unit: null, values: [idle, running, complete, pausing, paused, holding, held, restarting, stopping, stopped, aborting, aborted, resetting], time: neither, visibility: observable, default: null, description: "the state before the transition: written by the family that has a From column, else the previous state of the instance, idle for the first row"}
      - {name: to_state, type: string, nullable: false, unit: null, values: [idle, running, complete, pausing, paused, holding, held, restarting, stopping, stopped, aborting, aborted, resetting], time: neither, visibility: observable, default: null, description: "the state after the transition (state_machines.batch_phase_record): the 13 phase states of A170"}
      - {name: ts, type: integer, nullable: false, unit: s, values: null, time: valid, visibility: observable, default: null, description: "valid time of the transition"}
      - {name: ingested_at, type: integer, nullable: false, unit: s, values: null, time: transaction, visibility: observable, default: null, description: "the file received_at"}
      - {name: actor, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "who caused the transition, where a family records it; no family of S2 does, so it is always null"}
      - {name: command, type: string, nullable: true, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the command behind the transition (start, hold, restart, ...), where a family records it; no family of S2 does, so it is always null"}
      - {name: raw_ref, type: object, nullable: false, unit: null, values: null, time: neither, visibility: observable, default: null, description: "the raw file and line ({raw_file_id, line_no}); every row loaded from a file has one (K20)"}
  process_context:
    emitted: true
    kind: view
    description: "the process context of a result at an as-of time (data_model sections 2 and 5); the output of the as-of read, not a stored table"
