  - id: S003
    title: "BioProfile FLEX2 Instructions for Use manual (section 2.3.3 export; Appendix A specifications)"
    publisher: "Nova Biomedical"
    url: "https://novabiomedicaldocs.com/wp-content/uploads/filr/26707/LPN-57960-BioProfile-FLEX2-IFU-EN-Manual.pdf"
    accessed: 2026-10-29
    type: vendor-doc
    supports: "Results export as CSV to a shared folder C:\\Export on the Bridge computer (or to USB); file name pattern SampleResultsYYYY-MM-DD_HHMMSS.csv. Appendix A (read 2026-10-29 from a text conversion of the full manual): measurement ranges by selected dilution ratio (glucose 0.10-15.00 g/L at 1:1, 30 at 1:2, 60 at 1:4; lactate 0.10-6.00 g/L at 1:1; glutamine and glutamate 0.10-6.00 mmol/L; ammonium 0.20-25.00 mmol/L; cell density 0.10-35 e6/mL at 1:1, up to 80 e6 at 1:2 and 160 e6 at 1:6); imprecision specification (n >= 10): within-run CV 5.0% and day-to-day CV 7.0% for glucose, lactate, glutamine, glutamate and ammonium (SD 0.03 g/L within-run and 0.07 g/L day-to-day for glucose and lactate), pH SD 0.007 within-run and 0.018 day-to-day, pCO2 CV 5.0% and 7.0%, sodium 3.0% and 4.5%, potassium and calcium 4.0% and 5.6%; osmolality SD 3 mOsm/kg up to 400. Automatic 2-point calibration of the gas and chemistry modules every 2 h with a 1-point calibration at each sample; onboard QC can be scheduled. Analysis time for all modules 275 s in manual mode and 305 s from the carousel; sample volume for all modules 265 uL at cell-density dilution 1:2 or 1:6 and 350 uL at 1:1; chemistry plus cell density 235 s manual (265 s carousel). Default sample type in the software: chemistry 1:1, cell density 1:2. The manual differs slightly from the distributor page (S001: 270 s, 275 uL)."
    verification: agent-read
    used_in: [A019, A023, A036, A069, A070, A077, A078, A089, A090, A091, A092, A093, A101, A107]
