  # ---- kinetics and process control (added 2026-10-29) ----
  - id: S053
    title: "Computer programs for modeling mammalian cell batch and fed-batch cultures using logistic equations (Goudar)"
    publisher: "Cytotechnology 2012;64(4):465-475 (Springer; PMC3397109)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3397109/"
    accessed: 2026-10-29
    type: paper
    supports: "Introduction: typical mammalian fed-batch culture 12-16 d, starting density 0.2-1.0e6 cells/mL, peak density 10-30e6 cells/mL. Table 2, two published industrial CHO IgG fed-batch cultures (2 L and 5 L): maximum specific growth rate 0.64 and 0.54 per day, maximum death rate 0.16 and 0.07 per day, peak viable density 13.7 and 21.7e6 cells/mL, titer 4.1 and 9.8 g/L, average specific productivity 36.5 and 33.3 pg/cell/day, maximum 47.6 and 54.4 pg/cell/day. Logistic-fit parameters, not directly measured rates."
    verification: agent-read
    used_in: [A002, A008, A011, A080, A081, A086]
  - id: S054
    title: "Metabolic engineering of CHO cells to alter lactate metabolism during fed-batch cultures (Toussaint et al.)"
    publisher: "Journal of Biotechnology 217:122-131 (2016), open access"
    url: "https://www.sciencedirect.com/science/article/pii/S0168165615301826"
    accessed: 2026-10-29
    type: paper
    supports: "mAb-producing CHO line (parent) and a lactate-consuming engineered clone. Maximum specific growth rate in shake-flask batch 0.023 per h (parent) and 0.033 per h (engineered), 0.032 per h in fed-batch (engineered). Table 2, parent line in a 2 L bioreactor (0.6 L start): exponential phase glucose 2.49, glutamine 1.18, lactate +2.34 (production), ammonia 1.11 pmol/cell/d; stationary phase glucose 2.06, glutamine 0.56, lactate +0.24, ammonia 0.24. Shake-flask fed-batch parent: glucose 1.65, glutamine 0.53, lactate +1.18 (exponential); stationary lactate -0.03. The engineered clone consumed lactate after day 7 (-0.17 pmol/cell/d in the bioreactor, -0.15 to -0.36 in shake flasks). Specific productivity of this research line was only 1.7-2.7 pg/cell/d."
    verification: agent-read
    used_in: [A080, A082, A083, A084, A085]
  - id: S055
    title: "Evaluation of single-use optical and electrochemical pH sensors in upstream bioprocessing (Fratz-Berilla et al.)"
    publisher: "Heliyon 10(3):e25512 (2024), PMC10873650"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10873650/"
    accessed: 2026-10-29
    type: paper
    supports: "CHO fed-batch and perfusion runs, pH set point 7.1 +/-0.1. The pH set point range for mammalian cell bioreactors is typically at least 0.1 wide (about +/-0.05 pH). Average absolute discrepancy between in-line pH and an at-line analyzer 0.047 (reusable electrochemical probe), 0.044 (single-use electrochemical) and 0.072 (single-use optical); discrepancy correlated with batch age for both electrochemical types; a second reusable probe differed by 0.016 on average; all runs with the optical sensor showed drift to some degree. At-line checks at least daily are recommended for the optical sensor."
    verification: agent-read
    used_in: [A094, A095, A108]
  - id: S056
    title: "Using simple models to describe the kinetics of growth, glucose consumption, and monoclonal antibody formation in naive and infliximab producer CHO cells (Lopez-Meza et al.)"
    publisher: "Cytotechnology 2015 (doi 10.1007/s10616-015-9889-2; first 30,000 characters read)"
    url: "https://doi.org/10.1007/s10616-015-9889-2"
    accessed: 2026-10-29
    type: paper
    supports: "Shake-flask batch CHO-S cultures (naive and mAb producer) in diluted commercial medium. Monod fits with a glucose threshold of about 0.6 g/L below which growth stops: maximum specific growth rate 0.043 per h and Ks 0.929 g/L (producer), 0.050 per h and Ks 2.058 g/L (naive). Lactate was produced in exponential growth and consumed once glucose was depleted; the producer line's lactate consumption was about 0.05 ng/cell/day in glucose-depleted cultures. Producer specific productivity 0.58-1.0 pg/cell/day in this low-density setting."
    verification: agent-read
    used_in: [A080, A085, A109]
