  # ---- sample stability ----
  - id: S012
    title: "Effects of diluents on cell culture viability measured by automated cell counter (Chen et al.)"
    publisher: "PLoS ONE 12(3): e0173375"
    url: "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0173375"
    accessed: 2026-10-28
    type: paper
    supports: "CHO samples from shake flasks incubated neat for up to 55 min before Vi-Cell XR counting: viability-difference slope -0.03 per min (neat), -0.05 (fresh medium), -0.12 (PBS), -0.04 (PBS plus shear protectant). The paper's finding is a PBS-dilution artifact; hold temperature is not stated in the text read."
    verification: main-reread
    used_in: [A038, A039, A040]
  - id: S013
    title: "Novel Carbon Dioxide-Based Method for Accurate Determination of pH and pCO2 in Mammalian Cell Culture Processes (Klinger et al.)"
    publisher: "Processes 2020, 8(5), 520 (MDPI)"
    url: "https://www.mdpi.com/2227-9717/8/5/520"
    accessed: 2026-10-28
    type: paper
    supports: "Offline pH is used to readjust bioreactor probes, treating the offline value as the source of truth; hold time, temperature shift and CO2 degassing add offsets; pH not stable after sampling at higher cell density; Ambr250 liquid-handler samples before inoculation showed mostly positive offsets with mean about 0.05; single-point offsets above 0.1 are not unusual; 2 L working volume in 3 L bench vessels; 250 L SUB samples drawn by syringe. The 0.05 sentence was seen as a search excerpt of the same page."
    verification: main-reread
    used_in: [A002, A041, A051, A057, A067, A068]
  - id: S014
    title: "Evidence-based guidelines for controlling pH in mammalian live-cell culture systems (Michl et al.)"
    publisher: "Communications Biology 2019 (PMC6486606)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6486606/"
    accessed: 2026-10-28
    type: paper
    supports: "Bicarbonate medium in 200 uL 96-well plates moved to a CO2-free atmosphere alkalinizes immediately with a time constant of 2-3 h; the reverse reaction has a time constant of 45 min."
    verification: agent-read
    used_in: [A037, A042]
  - id: S015
    title: "Blood gas testing and related measurements: National recommendations (Croatian Society of Medical Biochemistry and Laboratory Medicine)"
    publisher: "Biochemia Medica (PMC5082214)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5082214/"
    accessed: 2026-10-28
    type: paper
    supports: "Clinical proxy: blood pH falls 0.02-0.03 per h at 22 C (<0.01 per h at 4 C) with glucose falling and lactate and pCO2 rising; plastic-syringe samples analysed within 30 min, within 5 min if cell counts are high."
    verification: agent-read
    used_in: [A037, A043, A045, A046]
  - id: S016
    title: "Aseptic Sampling Best Practices: Sample Collection for pH and Gas Analysis (application note SP-1022)"
    publisher: "Sartorius"
    url: "https://api.sartorius.com/document-hub/dam/download/5424/Aseptic-Sampling-Best-Practice-Application-Note-en-B-SP-1022-Sartorius.pdf"
    accessed: 2026-10-28
    type: vendor-doc
    supports: "Sample pH shifts as cells consume O2 and produce CO2; syringes limit gas exchange better than bags because of a stable surface-to-volume ratio; the longer the delay the less accurate the analysis."
    verification: agent-read
    used_in: [A037, A067]
  # ---- process: USP / DSP ----
  - id: S017
    title: "Product Development and Realisation Case Study A-Mab"
    publisher: "CMC Biotech Working Group (hosted by ISPE)"
    url: "https://ems.ispe.org/sites/default/files/attachments/public/a-mab-case-study-version.pdf"
    accessed: 2026-10-28
    type: paper
    supports: "Production culture 13-17 d (processes 13-15 d and 16-17 d), initial density 0.5-1.5e6/mL, glucose kept above 1.0 g/L by discrete feeds, harvest viability 40-80%; N-1 seed 2-4 d (200 L) and 3-5 d (1000-3000 L); Protein A input <=5 g/L, load 10-50 g/L over several cycles with pooled eluates, pool about 20 g/L with HCP about 7,200 ppm (3,000-12,000). Pool hold data are 'not shown'. No peak viable cell density is given."
    verification: main-reread
    used_in: [A003, A004, A005, A007, A010, A012, A052, A053]
