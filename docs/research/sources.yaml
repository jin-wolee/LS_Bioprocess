    used_in: [A047, A072, A073]
  - id: S023
    title: "Labeling tubes before collection threatens patient safety (Ernst)"
    publisher: "Annals of Blood 2018 (doi 10.21037/aob.2018.02.06)"
    url: "https://aob.amegroups.org/article/view/4318/html"
    accessed: 2026-10-28
    type: paper
    supports: "Clinical proxy: a study of 4.29 million specimens over 24 months found mislabeled 1.0%, unlabeled 4.6% and specimen-requisition mismatches 6.3%."
    verification: agent-read
    used_in: [A047]
  - id: S024
    title: "Effectiveness of Laboratory Practices to Reducing Patient Misidentification Due to Specimen Labeling Errors at the Time of Specimen Collection in Healthcare Settings: LMBP Systematic Review"
    publisher: "LMBP systematic review (PubMed Central PMC5701285; journal not recorded)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5701285"
    accessed: 2026-10-28
    type: paper
    supports: "Clinical proxy: standardized specimen labeling protocols cut labeling errors by a median relative 72.45% (interquartile interval -83.25 to -46.50); evidence on training and education of collection staff judged insufficient for a conclusion."
