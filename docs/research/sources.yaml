    accessed: 2026-10-29
    type: regulation
    supports: "Read through a page-extraction summary, not word for word. Medicines recall classes with their action timescale: Class 1 immediate action (risk of death or disability, usually a National Patient Safety Alert), Class 2 action within 48 hours (harm possible but not life-threatening), Class 3 action within 5 days (harm unlikely, recall for other reasons such as non-compliance with the marketing authorisation), Class 4 caution in use with no timescale; a company-led recall or notification is used when the licence holder can identify the affected customers. UK rules for human medicines; not a US or biologics-specific source."
