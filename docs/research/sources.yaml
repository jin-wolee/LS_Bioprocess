    supports: "Second-hand summary of S057: 18 viral contamination incidents since 1985 at 9 of the 20 biopharmaceutical companies that reported data; 12 of the 18 in CHO cells, the rest in human or non-human primate cells; all were found before drugs reached patients; many were first noticed because cells were dying or looked unhealthy; in two cases the cells looked normal and required safety testing found the virus; the most used test takes at least two weeks, so the virus can move further through manufacturing before it is found; a faster PCR-based test must be built for specific sequences; a 2009 incident shut one plant for about 10 months. No denominator (batches or reactor-years) is given. The CHO count differs from S059 (13 there)."
