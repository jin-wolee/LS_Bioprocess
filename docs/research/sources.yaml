    supports: "Industry survey of 434 biopharmaceutical developers and contract manufacturers (32 countries), 145 weighted responses on failures: a facility averages one batch failure every 40.6 weeks. For facilities of 1,000 L and larger the leading cause is contamination at 2.3% (average percentage rate), followed by operator error, equipment failure and out-of-specification; below 1,000 L the leading cause is material failure (1.9%) with product cross-contamination at 1.1%. Total failure rate 7.6% (large) and 6.6% (small). The text calls the large-facility contamination rate threefold higher than the small-facility rate without printing the small-facility figure. Self-reported, 2008, not specific to CHO or to a run mode; the unit of the percentage (batches) is the article's wording."
