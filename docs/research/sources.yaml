  - id: S025
    title: "Automating the Cell Counting Process"
    publisher: "Genetic Engineering & Biotechnology News, 2014-09-01 (Vol. 34, No. 15)"
    url: "https://genengnews.com/insights/automating-the-cell-counting-process"
    accessed: 2026-10-28
    type: blog
    supports: "Validation tutorial by a biopharma changing from hemacytometer to Vi-CELL XR, using 1e6/mL control beads and two operators: CV between counts and operators under 5% for both; operator-to-operator variability 2.81 versus 0.46 (six times lower for the automated method); manual counts only several hundred cells. Vendor-affiliated, bead standard, not cells in culture."
    verification: agent-read
    used_in: [A058, A059, A060, A072, A073]
