  - id: S022
    title: "An international study of the performance of sample collection from patients (Dzik et al.)"
    publisher: "Vox Sanguinis 85(1):40-47 (2003)"
    url: "https://experts.mcmaster.ca/scholarly-works/1748245"
    accessed: 2026-10-28
    type: paper
    supports: "Clinical proxy: 62 hospitals, over 690,000 samples; median mislabelling 6.1 per 1000 (1 in 165). Interquartile range 1.2-17 per 1000 and wrong-blood-in-tube median 0.5 per 1000 were seen only in a search summary of this record. Abstract record, not full text."
