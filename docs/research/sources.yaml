  - id: S108
    title: "A Guide to Defective Medicinal Products (published February 2026)"
    publisher: "MHRA Defective Medicines Report Centre (DMRC), GOV.UK"
    url: "https://assets.publishing.service.gov.uk/media/698f286b43eb912f2e15b3fd/DMRC_Guide-to-Defective-Medicinal_Products-Feb2026.pdf"
    accessed: 2026-10-29
    type: regulation
    supports: "Read sections 5 and 6 and the notification-recipient advice from a text conversion of the 66-page guide. Manufacturers must have a system for recalling 'promptly and at any time' and, as a statutory duty, must inform the authority 'immediately' of a defect that could result in a recall; the first report needs batch dates, an impact assessment of the batches affected (including admixed product) and proposals for recall, quarantine or other containment; the licence holder may be required to quarantine remaining stock during the investigation, extended to the wholesale chain in serious cases; the decision to recall is usually taken after consultation with the DMRC; recall depth (wholesaler, pharmacy or patient) depends on risk; the timescales on recall notifications are advice on priority, not legal deadlines; a final report is due no later than 12 weeks after the initial report unless agreed otherwise. The guide's own class table does not repeat the 48 h and 5 d timescales (S107 does)."
    verification: agent-read
