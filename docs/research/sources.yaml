    type: regulation
    supports: "Opened PDF read through section 3.2 and the first part of section 4 (the opened text ended mid-section 4; sections 5-7 not read). Read: section 2.2 lists contamination routes (animal-derived raw materials, environment, personnel) and says monitoring cell growth and viability may help early detection; section 3.2.2 requires 28-day indicator-cell testing with at least one sub-passage at two weeks for cell banks; section 4 says adventitious virus testing should be applied to each unprocessed bulk, that for perfusion or continuous harvest with hollow-fibre retention the cell-free harvest can be tested, and that for continuous harvest the sampling strategy (periodicity and composition) should be justified. Seen only in a search excerpt of the same PDF: the in vitro assay on unprocessed bulk is observed 28 days with a sub-passage at two weeks and may be cut to 14 days with a risk-based justification; NAT or targeted NGS can support real-time decisions; a detected virus means the harvest is not used unless justified, with root cause and extent checked; for continuous manufacturing, a procedure to segregate potentially contaminated material is expected and batch release should document absence of viral contamination for the period of harvest."
