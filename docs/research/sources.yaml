  - id: S061
    title: "Biosafety Testing of Biologicals for Mycoplasma Contamination (Armstrong, Patel, McKee)"
    publisher: "BioProcess International, 2010-07-01 (authors at a contract testing laboratory)"
    url: "https://www.bioprocessintl.com/analytical/biosafety-testing-of-biologicals-for-mycoplasma-contamination"
    accessed: 2026-10-29
    type: blog
    supports: "Testing for mycoplasma is required by regulators for biologics made in cell substrates, including cell banks. Mycoplasma can be present with no obvious change in the host culture, even at 10-100 times the host cell concentration. All compendial culture methods run for 28 days with subculturing (two to four subcultures depending on the text); under the European and US methods the indicator-cell method grows the sample 3-5 days and then passages onto coverslips for another 3-5 days, while the older US and Japanese points-to-consider texts stain after one 3-5 day step. Written in 2010; the revised European chapter is in S062."
    verification: agent-read
