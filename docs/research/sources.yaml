  # ---- sample stability ----
  - id: S012
    title: "Effects of diluents on cell culture viability measured by automated cell counter (Chen et al.)"
    publisher: "PLoS ONE 12(3): e0173375"
    url: "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0173375"
    accessed: 2026-10-28
    type: paper
    supports: "CHO samples from shake flasks incubated neat or in a diluent for up to 55 min before Vi-Cell XR counting. Handling was non-sterile and open to the environment at room temperature (diluents brought to 18-22 C before use). Viability-difference slopes (relative to the neat control average; percentage points per minute, unit inferred from the paper's own remark that -0.12 is about 4% over 30 min): -0.03 neat, -0.05 fresh medium, -0.12 PBS, -0.04 PBS plus shear protectant; no significance test is reported for the slopes. The authors state that the neat samples did not exhibit a decrease in viability and attribute the decline to the diluent."
    verification: main-reread
    used_in: [A038, A039, A040]
  - id: S013
    title: "Novel Carbon Dioxide-Based Method for Accurate Determination of pH and pCO2 in Mammalian Cell Culture Processes (Klinger et al.)"
    publisher: "Processes 2020, 8(5), 520 (MDPI)"
    url: "https://www.mdpi.com/2227-9717/8/5/520"
    accessed: 2026-10-28
    type: paper
    supports: "Abstract: a sample-based offline pH measurement is commonly used to ensure correct probe signals after sterilisation and to detect drifts of probe signals. Introduction: when the difference exceeds defined criteria, a readjustment is applied with the offline value as the source of truth; sampling procedures, equipment, hold times, temperature shifts and CO2 degassing all add offsets; at higher cell densities pH must not be considered stable after sampling. Three measured cases of offline minus bioreactor pH, all on cell-free medium before inoculation: (1) 2 L bench vessels, manual sampling, two independent pH meters, sample at 32 +/-2 C against 37 C in the vessel: offsets 0.02-0.06, all positive, average about 0.04 (the authors call this a best case); (2) Ambr 250 liquid handler, 200 uL samples: mostly positive, mean difference about 0.05; (3) 250 L single-use vessels, samples drawn by sterile syringe, blood-gas analyzer: mean difference 0.021, and an offset above 0.1 for a single data point is called not unusual. Bench vessels were 3 L total with about 2 L working volume. The GMP alternative described uses delta-probe alarms instead of frequent offline readjustment."
    verification: main-reread
    used_in: [A002, A041, A051, A057, A067, A068, A104, A108, A113]
  - id: S014
    title: "Evidence-based guidelines for controlling pH in mammalian live-cell culture systems (Michl et al.)"
    publisher: "Communications Biology 2019 (PMC6486606)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6486606/"
    accessed: 2026-10-28
    type: paper
    supports: "Bicarbonate medium in 200 uL 96-well plates moved to a CO2-free atmosphere alkalinizes immediately with a time constant of 2-3 h; the reverse reaction has a time constant of 45 min."
