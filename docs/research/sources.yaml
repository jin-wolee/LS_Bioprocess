  - id: S063
    title: "Impacts of intentional mycoplasma contamination on CHO cell bioreactor cultures (Fratz-Berilla et al.)"
    publisher: "Biotechnology and Bioengineering 116(12):3242-3252 (2019), PMC6900124"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6900124/"
    accessed: 2026-10-29
    type: paper
    supports: "Opened through the methods and the first results sections (about 22,000 characters). CHO DG44 IgG1 line in single-use rocking bioreactors, 1 L culture, perfusion 1-3.5 L/day, bleed when density passed 55e6 cells/mL (down to 20-40e6), cultures sampled twice daily about 8 h apart for cell count, pH and metabolites on an at-line analyzer. Mycoplasma arginini spiked at 15-300 CFU/mL grew exponentially, peaked near 1e7 CFU/mL whatever the spike level, with doubling time about 6 h or more. Conclusion: effects appeared 2-6 days after introduction; CHO growth plateaued 2-4 days after contamination and viability fell after 3-6 days; glucose and glutamine consumption fell with growth; ammonia accumulated and arginine was consumed; DO and the CO2/base control showed changes from about 2 days (DO rose as oxygen use stopped; CO2 in the gas mix rose and base was not needed in early-stage cases); nothing changed for at least 2 days. Conventional mycoplasma assays are quoted as taking 14-28 days. One species and one line; the timing depends on density and perfusion rate at the time of contamination."
    verification: agent-read
    used_in: [A128, A129, A130, A138, A140, A144, A156, A158]
  - id: S064
    title: "Troubleshooting Bacterial Contamination In Bioreactors (Blackwell)"
    publisher: "Bioprocess Online guest column, 2017-01-31"
    url: "https://www.bioprocessonline.com/doc/troubleshooting-bacterial-contamination-in-bioreactors-0001"
    accessed: 2026-10-29
    type: blog
    supports: "Consultant's column, opinion grade. The sterile boundary after steam-in-place is kept by sterile-grade gas and liquid filtration, steaming of ports before and after each feed or sampling event, and positive pressure. The author ranks breach modes by probability from personal experience: feed and sampling ports (improper steaming, cracked diaphragms, missing gaskets) are the more probable route; gas-filter breaches less probable; seals, valves, dead legs and corrosion are other possibilities. Root-cause work uses the time of the sudden DO drop to estimate when contamination began and its slope to estimate organism growth rate, a review of events in that window (sampling, additions, new probes), valve steaming profiles, species identification and maintenance history, drawing on QC data, historians, batch records, work orders, nonconformance records and training records. Mycoplasma and virus are out of its scope."
    verification: agent-read
    used_in: [A136, A137, A139, A140, A149, A157, A158]
  - id: S065
    title: "Investigating Bioreactor Contamination, Modeling Contaminant Introduction, and Ensuring Bioburden Test Reliability (Muralidharan)"
    publisher: "BioPharm International 38(3):20-24 (2025-04-07), peer-reviewed; author at a contract manufacturer"
    url: "https://www.biopharminternational.com/view/investigating-bioreactor-contamination-modeling-contaminant-introduction-and-ensuring-bioburden-test-reliability"
    accessed: 2026-10-29
    type: paper
    supports: "Mammalian-cell bioreactor contamination is identified through process deviations: a drop in % DO (microbial respiration), a drastic pH decrease (acid production), unusual metabolic shifts in nutrient consumption, and unexpected changes in growth and viability against history. Containment: isolate the bioreactor, stop feeds (nutrients, base, antifoam). Investigation: bioburden tests (CFU/mL), Gram stain, molecular identification and turbidity; feed samples tested at three times (identification, +6-8 h, +6-8 h) to estimate growth rate and back-calculate load at the time of introduction; Poisson analysis of bioburden test reliability; chronology of bioreactor activities mapped against the estimated onset. No numeric DO or pH thresholds are given."
    verification: agent-read
    used_in: [A139, A140, A141, A149, A158, A176]
  - id: S066
    title: "Biotech Facilities Average a Batch Failure Every 40.6 Weeks (Langer; BioPlan Associates annual survey)"
    publisher: "BioProcess International, 2008-09-01"
    url: "https://www.bioprocessintl.com/bioanalytical-methods/biotech-facilities-average-a-batch-failure-every-40-6-weeks"
