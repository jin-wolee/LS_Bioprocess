  # ---------------- design extension: cell lines, operating modes, contamination (added 2026-10-29) ----------------
  - id: A119
    name: cell_line_growth_rate_cv_between_clones
    default: 0.065
    range: [0.03, 0.15]
    unit: "fraction (SD / mean)"
    grade: D
    range_grade: A
    sources: [S077, S053, S054, S079]
    notes: "Derived. Five clonal CHO populations from one stability study differed by at most 0.0041 per h in maximum growth rate between the two most distant clones (S077, search excerpt only). Against the 0.027 per h default of A080 that span is 0.0041 / 0.027 = 15%; the expected range of five normal draws is about 2.33 SD, so SD is about 15% / 2.33 = 6.5% of the mean. The base value comes from other studies (A080), not from S077, so the ratio is a cross-study proxy. Three CHO K1 GS lines from one parent also grew differently (S079). The range ends 0.03 and 0.15 are the author's bounds."
  - id: A120
    name: cell_line_qp_max_over_min_ratio
    default: 2.5
    range: [2.4, 15.5]
    unit: "ratio (highest / lowest clone)"
    grade: A
    range_grade: D
    sources: [S074, S079]
    notes: "Eight clones of one mAb in 1.2 mL wells (S074): specific productivity spanned 17.31-41.95 pg/cell/d in semi-perfusion in a fed-batch medium (ratio 2.4), 16.46-39.14 in a perfusion medium (2.4), 16.46-46.57 with partial exchange (2.8) and 1.64-25.47 in fed-batch (15.5); the ratios are derived from the quoted ends, so the range is D. The default 2.5 sits at the narrow end by choice: the 15.5 comes from well-scale fed-batch where rank order also changed with operating mode, and no bioreactor-scale spread was found. Within two similar-growth lines, cell-specific productivity also differed (S079). The spread is mode-dependent, so a clone draw should be repeated if the mode changes."
  - id: A121
    name: cell_line_peak_vcd_max_over_min_ratio
    default: 2.5
    range: [1.6, 5.3]
    unit: "ratio (highest / lowest clone)"
    grade: A
    range_grade: D
    sources: [S074]
    notes: "Same panel as A120 (S074): maximum viable cell concentration 4-21e6 cells/mL in fed-batch wells (ratio 5.3), 23-54e6 in semi-perfusion in a fed-batch medium (2.3) and 25-41e6 in a perfusion medium (1.6), derived from the quoted ends (range grade D). Well scale, not bioreactor. The default 2.5 is a choice. In fed-batch wells viability fell below 50% by day 10 for all clones except one at about 70% (S074)."
  - id: A122
    name: cell_line_lactate_production_multiplier
    default: 1.0
    range: [0.44, 1.25]
    unit: "factor on A084"
    grade: P
    sources: [S075, S074, S076]
    notes: "Multiplier on the platform lactate production rate (A084). Lower end: a high-producer clone made 46% less lactate at mid-exponential and 56% less at the end of exponential growth than its parental clone (S075, search excerpt only; an inducible research system, not a production platform), so 0.54 and 0.44. Upper end: one of eight clones reached about 25 mmol/L lactate against 15-20 for the rest in fed-batch wells (S074), a concentration ratio of 1.25 used as a stand-in for a rate; another study of 11 clones found one that made clearly more lactate on days 3-8 (S076, search excerpt only). Concentrations are not rates, so this end is proxy grade."
  - id: A123
    name: cell_line_lactate_consumption_trigger
    default: "net consumption starts when glucose falls below about 0.6 g/L; applies only to clones flagged as switchers"
    range: ["glucose below about 0.6 g/L", "late (after day 7)", "never"]
    unit: category
    grade: A
    sources: [S056, S074, S054]
    notes: "Refines A085 (global switch, default off). When net consumption starts: lactate fell as glucose reached zero in eight clones in wells (S074; two clones fell in semi-perfusion but stayed flat in fed-batch); an infliximab-producing CHO-S line consumed lactate after the maximum cell concentration was achieved, which approximately coincided with glucose depletion, with growth stopping near 0.6 g/L glucose (S056); an engineered clone consumed lactate after day 7 in fed-batch while its parent kept producing (S054). In a glucose-controlled fed-batch, A010 keeps glucose above 1.0 g/L, so the first rule never fires; a consumer there needs the late rule. The share of clones that are switchers has no source, hence grade A."
  - id: A124
    name: operating_mode_set
    default: "batch; fed-batch; intensified fed-batch (high inoculation density from an N-1 perfusion or enriched-batch seed, production in fed-batch); perfusion (cell retention, bleed, cell-free permeate harvest)"
    range: "n/a"
    unit: category
    grade: S
    sources: [S079, S080, S078, S074, S060]
    notes: "Range n/a because this is a list. Extends A003, which only lists fed-batch and perfusion. N-1 intensification raises the production inoculation density to 2-20e6 cells/mL (S079); perfusion pairs a fresh-medium feed with a cell-free harvest and a bleed that holds density (S080); semi-perfusion by medium exchange is used at small scale (S074). Continuous chemostat is left out on purpose: no CHO production case for it was found in the pages read."
  - id: A125
    name: batch_mode_duration_days
    default: 5
    range: [3, 7]
    unit: d
    grade: A
    sources: [S074, S078]
    notes: "No source gives the length of a pure batch CHO production culture. The pages read show only 3-day batch phases that precede feeding or perfusion (S074, S078). The default and range are the author's choice. Glucose is not held above a floor in batch mode (A010 applies to fed-batch)."
  - id: A126
    name: intensified_fedbatch_inoculation_density_e6_per_ml
    default: 5
    range: [2, 20]
    unit: "1e6 cells/mL"
    grade: A
    range_grade: S
    sources: [S079]
    notes: "N-1 seed intensification enables production inoculation at 2-20e6 cells/mL (S079, abstract); the default 5 is a choice inside that range (range grade S). The standard fed-batch value is A007 (0.5-1.5e6). Cell-line dependent: of three CHO lines from one parent, two behaved alike on enriched-batch and perfusion seeds and the third differed (S079)."
  - id: A127
    name: intensified_fedbatch_duration_days
    default: 10
    range: [7, 14]
    unit: d
    grade: A
    sources: [S079]
    notes: "S079 says a higher inoculation density could shorten the production culture, but the pages read give no duration for an intensified run (its fed-batch comparisons ran to day 14). The default 10 d is a choice; the upper end equals the fed-batch default of A004."
  - id: A128
    name: perfusion_rate_vvd
    default: "1 rising to 3 vessel volumes per day"
    range: [0.75, 3.5]
    unit: vvd
    grade: P
    range_grade: S
    sources: [S080, S063, S074, S078]
    notes: "Fresh-medium exchange in vessel volumes per day. A fed-batch versus perfusion case starts perfusion at 1 vvd and raises it to 3 (S080); a perfused 1 L CHO culture ran at 1 to 3.5 L/day, stepped up with density (S063); well-scale semi-perfusion used 1 and 0.75 reactor volumes per day (S074). In an N-1 perfusion the rate is set once a day after sampling or by a capacitance probe every 30 min (S078). The ramp shape is a choice. The same case (S080) reaches 60e6 cells/mL on day 10, the default of A009, which is left unchanged here. Regraded from S to P on 2026-10-29 for consistency with A009: the default ramp (1 rising to 3 vvd) is the worked case in S080, which the paper calls an illustration with an assumed constant specific productivity, not a measurement. The range ends are measured values from other studies (up to 3.5 L/day in a 1 L culture in S063, 0.75 reactor volumes per day in S074), so range_grade is S."
  - id: A129
    name: perfusion_bleed_rate_vvd
    default: 0.3
    range: "fixed"
    unit: vvd
    grade: P
    sources: [S080, S063]
    notes: "A constant 0.3 vvd bleed from day 10 in a 30 d case with perfusion at 3 vvd, leaving a permeate harvest of 2.7 vvd (S080). A different run bled intermittently when density passed 55e6 cells/mL, down to 20-40e6 (S063). One published illustration, not a norm; the bleed rule is a mode choice. Regraded from S to P on 2026-10-29 for consistency with A009: 0.3 vvd is the constant bleed assumed in the S080 illustration, and the one measured run (S063) used a different, intermittent rule, so no measurement supports the default."
  - id: A130
    name: perfusion_samples_per_reactor_per_day
    default: 2
    range: [1, 2]
    unit: "samples/reactor/day"
    grade: S
    sources: [S063, S078]
    notes: "Culture samples were taken in the morning and evening about 8 h apart in a perfused CHO bioreactor study (S063); an N-1 perfusion set its perfusion rate once a day after sampling (S078). Both are lab-scale studies. Fed-batch cadence is A014 and A015; permeate and bleed are separate streams (A133)."
  - id: A131
    name: intensified_fedbatch_samples_per_reactor_per_day
    default: 1
    range: "fixed"
    unit: "samples/reactor/day"
    grade: S
    sources: [S079]
    notes: "Production bioreactors were sampled daily for gases, cell count, nutrients and metabolites; amino-acid samples were taken every second day from day 2 to day 14 (S079). The same as the fed-batch default A014. A perfused N-1 seed is sampled as in A130."
  - id: A132
    name: perfusion_harvest_window_h
    default: 24
    range: [8, 168]
    unit: h
    grade: A
    sources: [S060]
    notes: "Context unit for continuous harvest. ICH Q5A(R2) asks that the sampling strategy (periodicity and composition) for a continuous harvest be justified and, in a passage seen only as an excerpt, that release document the absence of viral contamination for the period of harvest (S060), but it gives no length. A 24 h window (one daily harvest pool) is a design choice; 8 h and 168 h are the author's bounds."
  - id: A133
    name: perfusion_stream_set
    default: "medium in; cell-free permeate/harvest out; cell bleed out; culture samples"
    range: "n/a"
    unit: category
    grade: S
    sources: [S080, S060]
    notes: "Range n/a because this is a list. The perfusion rate equals the harvest rate plus the bleed rate in steady state (S080). With hollow-fibre retention, where cells are not accessible, the cell-free harvest is what gets tested (S060). Retention-device or filter events and transmembrane pressure matter operationally, but no source was read for them and they are not modelled."
  - id: A134
    name: sampling_port_connection_limit
    default: 50
    range: "fixed"
    unit: "samples per connection"
    grade: S
    sources: [S069]
    notes: "Needle-free Luer-lock sampling connections on single-use bioreactor bags are described as validated for up to 50 samples according to one vendor, as reported in a trade review (S069). A 14 d fed-batch at 1.6 samples/day is about 22 draws (A004, A014, A015; derived); a 40 d perfusion at 2 samples/day is 80 draws (A130, A006; derived), so it needs a second port or a closed sampling device. The 50 is a validation limit, not a failure threshold."
  - id: A135
    name: contamination_probability_per_batch
    default: 0.0077
    range: [0.0077, 0.023]
    unit: "probability per batch"
    grade: D
    sources: [S066, S067, S058]
    notes: "Microbial contamination as the leading stated cause of batch failure was 2.3% in facilities of 1,000 L and larger; the article calls that threefold the small-facility rate, so 2.3 / 3 = 0.77% below 1,000 L (S066: an industry survey of 434 developers and contract manufacturers, 2008, self-reported, not cell-line specific). Another source says the rate in production-scale bioreactors is still above 2% (S067, search excerpt only). Expected contaminated batches among the 24 reactors of A001: 24 x 0.0077 = 0.18 and 24 x 0.023 = 0.55 (derived), so a scenario that needs an event should inject it, not wait for chance. Viral events are far rarer: 18 since 1985 at 9 of 20 reporting companies, with no denominator (S058)."
  - id: A136
    name: contamination_probability_per_sampling_event
    default: 0.0002
    range: [0, 0.001]
    unit: "probability per draw"
    grade: A
    range_grade: D
    sources: [S064, S068, S069, S070]
    notes: "No measured rate was found. Qualitative support: feed and sampling ports are named the more probable breach route by one consultant from experience (S064); contamination probability grows with the number of operations in a batch (S068, abstract); frequent aseptic sampling is standing practice and connections have a validated draw count (S069); closed sterile sampling is marketed for exactly the bioburden and mycoplasma samples (S070, vendor, excerpt only). Upper bound by arithmetic: if sampling were the only route, the per-batch rate divided by about 22 draws per fed-batch (A004, A014, A015) gives A135 0.0077 / 22 = 0.00035 up to 0.023 / 22 = 0.001 (range end D). The default 0.0002 sits below that bound by choice. Manual versus closed sampling is not modelled."
  - id: A137
    name: contamination_type_mix
    default: "bacterial 0.70; fungal 0.20; mycoplasma 0.08; viral 0.02 (used only if a type is drawn at random; otherwise the scenario names the type)"
    range: "n/a"
    unit: "probability weights"
    grade: A
    sources: [S058, S059, S064, S061, S081]
    notes: "Range n/a because these are weights. No source gives a mix. What is known: bacterial contamination is the usual explanation of a sudden bioreactor failure in trade practice (S064, S065); mycoplasma is reported at facilities and in lab work without a per-batch rate (S061, S063); viral contamination is rare, 18 events since 1985 (S058), mostly in CHO and traced to animal-derived raw materials or medium components (S059, excerpt only). Some contaminants evade compendial methods: one bacterium passed 0.1 um filters and was not detectable by compendial methods (S081, excerpt only). The weights only order the types by rarity and are a choice; scenarios should name the type."
  - id: A138
    name: mycoplasma_signal_lag_days
    default: 2
    range: [2, 6]
    unit: d
    grade: S
    sources: [S063]
    notes: "After a CHO DG44 perfusion bioreactor was spiked with Mycoplasma arginini, nothing changed for at least 2 d; growth plateaued 2-4 d after the spike, viability began to fall after 3-6 d, and DO and gas-mix/base-addition trends were indicators from about 2 d (S063). The organism peaked near 1e7 CFU/mL and doubles in about 6 h or more (S063). One species, one line, perfusion; the timing depends on cell density and perfusion rate at the time of contamination, and for other species the cells may not be affected at all."
  - id: A139
    name: bacterial_onset_to_signal_lag_h
    default: 12
    range: [4, 36]
    unit: h
    grade: A
    sources: [S064, S065, S082]
    notes: "No source gives a lag. Direction only: contamination of a mammalian-cell bioreactor shows first as a drop in dissolved oxygen, then a pH fall, shifted nutrient use and changed growth or viability (S065); the time of the DO drop is used to back-estimate when contamination began (S064); in one study conductivity rose hours before DO fell (S082, abstract seen as an excerpt). The lag depends on organism growth rate, starting count and cell density. Fungal contamination uses the same placeholder."
  - id: A140
    name: contamination_signature_by_type
    default: "bacterial/fungal: DO falls, pH falls, nutrient use and growth or viability deviate from history; mycoplasma: growth plateau then viability fall, glucose and glutamine uptake fall with growth, ammonia rises, arginine is consumed, DO rises and CO2 in the gas mix rises with little base needed; virus: possibly no process change, or a growth or viability change, often found by required tests"
    range: "n/a"
    unit: category
    grade: S
    sources: [S065, S064, S063, S058, S060]
    notes: "Range n/a because this is a description. Bacterial direction: S065, S064. Mycoplasma direction and timing: S063. Virus: in two consortium cases the cells looked normal and testing found the virus, in many others dying or unhealthy cells were the first sign (S058); monitoring growth and viability may help early detection (S060). Direction only; magnitudes are A141."
  - id: A141
    name: bacterial_signal_magnitude_placeholder
    default: "DO reaches its low alarm within 6 h after the lag; pH falls 0.3 below set point before base addition catches up"
    range: "n/a"
    unit: "% air saturation and pH units"
    grade: A
    sources: [S065]
    notes: "Range n/a because this is a placeholder text. S065 says 'a drop in % DO' and 'a drastic decrease in pH' without numbers. The values are a choice meant to cross a normal alarm band (the pH controller deadband of A095 is +/-0.05 for comparison) and should be kept as scenario knobs; remove if the design uses categorical severity instead."
  - id: A142
    name: bioburden_test_turnaround_days
    default: 5
    range: [3, 7]
    unit: d
    grade: P
    sources: [S073]
    notes: "Plate-count method for non-sterile products: aerobic count plates at 30-35 C for 3-5 d and yeast and mold plates at 20-25 C for 5-7 d (S073, search excerpt of a harmonization document; chapter scope is non-sterile products, so applying it to an in-process bioreactor sample is a proxy). A site's in-process method may differ. Transport and logging time are separate. The default 5 d is the upper end of the bacterial count and the lower end of the fungal count."
  - id: A143
    name: sterility_test_turnaround_days
    default: 14
    range: "fixed"
    unit: d
    grade: S
    sources: [S072]
    notes: "Media are incubated for not less than 14 days (S072, a 2008 interim draft of the harmonized chapter; the current official text was not open). A satisfactory result only means no contaminant was found in the sample examined. The chapter's scope is articles required to be sterile, so using it for a production-bioreactor sample or an in-process pool is a design choice. Transport time is separate."
  - id: A144
    name: mycoplasma_culture_turnaround_days
    default: 28
    range: [14, 28]
    unit: d
    grade: S
    sources: [S061, S063, S083]
    notes: "All compendial culture methods run 28 days with subcultures (S061; also S083 for direct culture). Conventional assays are quoted as 14-28 days (S063), the shorter end reflecting older US wording. A negative result needs the full period."
  - id: A145
    name: mycoplasma_indicator_cell_turnaround_days
    default: 8
    range: [6, 10]
    unit: d
    grade: D
    sources: [S061, S083]
    notes: "Under the European and US methods the sample grows 3-5 d on indicator cells and is then passaged onto coverslips for another 3-5 d (S061), so 6-10 d; a 2022 trade article says 6-7 d (S083, search excerpt only). The default 8 d is the midpoint of 6-10. Older US and Japanese wording stained after a single 3-5 d step (S061)."
  - id: A146
    name: nucleic_acid_test_turnaround_days
    default: 1
    range: [0.33, 3]
    unit: d
    grade: A
    sources: [S062, S060, S059, S058]
    notes: "Nucleic-acid tests (PCR, targeted sequencing) are accepted alternatives to the indicator cell method for mycoplasma (S062, excerpt only) and can support real-time decisions for specific viruses (S060). No turnaround is stated in the pages read. A 1994 mouse minute virus contamination was found by PCR on unprocessed bulk in 8 h (S059, excerpt only), giving the lower end 0.33 d. Sequence-specific: it finds only what the assay targets (S058). The default and the upper end are choices."
  - id: A147
    name: adventitious_virus_in_vitro_assay_turnaround_days
    default: 28
    range: [14, 28]
    unit: d
    grade: S
    sources: [S060, S058]
    notes: "Indicator cell cultures are observed for 28 days with at least one sub-passage at two weeks, and the duration may be cut to 14 days with a risk-based justification (S060; the 28 d for cell banks was read in section 3.2.2 of the opened text, the 14 d reduction and its application to unprocessed bulk were seen in a search excerpt of the same file). The press summary says the most used test takes at least two weeks (S058). Applies to unprocessed bulk of each batch."
  - id: A148
    name: contamination_test_sample_volume_ml
    default: "mycoplasma 10.5 mL culture + 1 mL indicator cell = 11.5 mL; sterility 20 mL per medium for a container above 40 mL, two media"
    range: "n/a"
    unit: mL
    grade: S
    sources: [S083, S072]
    notes: "Range n/a because the default lists several tests. Mycoplasma volumes are from a trade article (S083, search excerpt only). The sterility table is written for final-container units (S072, Table 2), not for a bioreactor, so its 20 mL per medium is a scale proxy. No bioburden volume was found. Against the culture volume, 11.5 mL is 77-115% of a micro-parallel vessel (A110, 10-15 mL), 4.6-11.5% of a mini-parallel one (A114, 100-250 mL) and 0.23-0.58% of a 2-5 L bench vessel (A002) (derived), so these tests cannot be drawn from the smallest vessels and need pooled or end-of-run material there."
  - id: A149
    name: contamination_investigation_scope
    default: "walk back from a positive result to: (1) all samples and results of the affected reactor since the estimated onset; (2) the pooled harvest, downstream pool and lots holding its material; (3) other reactors or batches sharing the seed train, feed lot, media lot or equipment; (4) a written deviation record with conclusions and follow-up"
    range: "n/a"
    unit: category
    grade: S
    sources: [S071, S060, S064, S065]
    notes: "Range n/a because this is a rule list. Onset is estimated from the DO drop and growth rate, and events in that window (sampling, additions, new probes) are reviewed (S064, S065); feed samples are tested at several times to back-calculate load at introduction (S065). Harvest from an affected unprocessed bulk is not used unless justified and potentially contaminated material is segregated; continuous processes document absence over the harvest period (S060, last two points from a search excerpt). The investigation extends to other batches associated with the failure, whether or not distributed, and is written up with conclusions and follow-up (S071). Part 211 is cGMP for finished pharmaceuticals; which text governs a given biologic is a regulatory question not settled here. Which entities count as 'associated' is a design choice."
  - id: A150
    name: profile_cell_line_clone_panel
    default: "per-reactor clone drawn around the platform kinetics"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S074, S077, S075, S053, S054]
    components: [A119, A120, A121, A122, A080, A084, A086]
    notes: "Each reactor draws its clone from the spreads A119 (growth), A120 (productivity), A121 (peak density) and A122 (lactate production) around the platform means A080, A084 and A086. Grade is the weakest component; the productivity and density spreads are assumed defaults on well-scale data."
  - id: A151
    name: profile_cell_line_lactate_consumer
    default: "clone that turns to net lactate consumption late in the run"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S054, S056, S074]
    components: [A080, A084, A085, A123]
    notes: "Net consumption after the producing phase: an engineered clone consumed lactate at -0.17 pmol/cell/d in a 2 L bioreactor after day 7, while its parent produced +2.34 in the exponential phase (S054); a CHO-S line consumed lactate after the maximum cell concentration was achieved (S056). Components: growth (A080), exponential production (A084), the global switch (A085, on for this profile) and the trigger (A123)."
  - id: A152
    name: profile_cell_line_high_lactate_producer
    default: "clone at the upper lactate multiplier (1.25 x A084)"
    range: "bundle"
    unit: bundle
    grade: P
    sources: [S074, S076]
    components: [A084, A122]
    notes: "Upper end of A122. Proxy because the multiplier rests on a concentration ratio in wells (S074) and an excerpt of an 11-clone study (S076)."
  - id: A153
    name: profile_mode_batch
    default: "single inoculation, no feed, no outflow; harvest at the end"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S074, S078]
    components: [A125, A007, A014]
    notes: "Context unit: one batch id per reactor, as in fed-batch. Glucose falls without a floor, so lactate behaviour (A123) matters more. Duration A125, inoculation A007, cadence A014."
  - id: A154
    name: profile_mode_fed_batch
    default: "current default: bolus-fed, 14 d, one batch id per reactor"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S017, S019, S053]
    components: [A003, A004, A007, A008, A010, A014, A015]
    notes: "Components: mode default (A003), duration (A004), inoculation (A007), peak density (A008), glucose floor (A010), cadence (A014, A015). Extra context: feed events (A050). Working volume rises with feeds."
  - id: A155
    name: profile_mode_intensified_fed_batch
    default: "fed-batch started from a high-density seed"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S079, S078, S017]
    components: [A126, A127, A131, A005, A010]
    notes: "The production reactor is a fed-batch started at A126; its seed (a perfused N-1 or an enriched batch) is a lineage parent, so the context unit gains a seed-lot link. Daily samples (A131) plus seed-train samples (A130 when the seed is perfused). Components also include the N-1 duration (A005) and glucose floor (A010)."
  - id: A156
    name: profile_mode_perfusion
    default: "long run with medium in, permeate and bleed out; no single batch boundary"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S080, S063, S060, S019, S069]
    components: [A006, A009, A128, A129, A130, A132, A133, A134]
    notes: "Duration A006, peak density A009, rate A128, bleed A129, cadence A130, harvest window A132, streams A133, port limit A134. The context unit is a campaign split into harvest windows (S060, last parts from an excerpt). Over 40 d at 2 samples/day a single port passes its 50-draw validation limit (derived in A134)."
  - id: A157
    name: profile_contamination_origin
    default: "rare, scenario-injected event; sampling is one route among several"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S066, S064, S068, S069, S058]
    components: [A135, A136, A137, A134]
    notes: "Rate per batch (A135), added risk per draw (A136), type mix (A137) and the draw-count limit of a port (A134). Few viral events were ever reported (S058), so the type mix is assumed."
  - id: A158
    name: profile_contamination_detection
    default: "process signals first, confirming tests days later"
    range: "bundle"
    unit: bundle
    grade: A
    sources: [S063, S065, S064, S082, S073, S072, S061, S083, S062, S060, S059, S058]
    components: [A138, A139, A140, A141, A142, A143, A144, A145, A146, A147, A148]
    notes: "Signals: A140, lags A138 and A139, magnitude A141. Confirming tests: bioburden A142, sterility A143, mycoplasma culture A144 or indicator cells A145, nucleic-acid test A146, virus assay A147; sample volumes A148. The at-line analyzers keep returning results for days or weeks after the unit was already contaminated."
  # ---------------- device output formats (S2 scope extension; modeled on public documentation) ----------------
  - id: A159
    name: metabolite_analyzer_export_file_name
    default: "SampleResults[<analyzer id>]YYYY-MM-DD_HHMMSS.csv, one file per export action"
    range: "pattern, not numeric"
    unit: text
    grade: S
    sources: [S003, S086]
    notes: "Pattern and sibling files from the manual (section 2.3.3); the analyzer id between the word and the date comes from a community regular expression (S086), so that part is weaker evidence. An export is an operator-selected set of rows, so a file does not map one-to-one to a draw."
  - id: A160
    name: metabolite_analyzer_csv_layout
    default: "quoted header row, optional units row, one data row per analysis, trailing comma, blank cell when a value is absent"
    range: "units row on or off"
    unit: layout
    grade: P
    sources: [S086, S038]
    notes: "Header spellings come from community fixtures; the vendor manual lists screen fields only. S038 says units are not in the export, while a 2025 fixture has a units row. The parser must handle both."
  - id: A161
    name: analyzer_timestamp_format_and_zone
    default: "local wall clock with no zone; date order YYYY MM DD, separator '-', 24 h as the simulator default; the other 2 orders, 3 separators and 12 h are test variants"
    range: "3 orders x 3 separators x 2 clock styles"
    unit: format
    grade: A
    range_grade: S
    sources: [S003, S004, S038]
    notes: "The options are in the manual (3.5.1.7 to 3.5.1.9), so the range is sourced; which option is the simulator default is a choice, hence grade A. Day-first order is ambiguous with month-first and the integrator guide tells users to avoid it. The device UTC offset comes from configuration, not from the file; the OPC side exposes UTC and the local offset as separate tags (S004)."
  - id: A162
    name: metabolite_analyzer_units
    default: "glucose and lactate g/L; glutamine, glutamate, ammonium, sodium, potassium, calcium mmol/L; pO2 and pCO2 mmHg; cell density x10^6 cells/mL; osmolality mOsm/kg"
    range: "unit options per the manual table in section 3.5.3.1"
    unit: text
    grade: P
    sources: [S003, S038, S086]
    notes: "The unit options are in the manual. The default of each is taken as the first-listed option, which agrees with a community connector; the bold marking of defaults did not survive text conversion, so the defaults are inferred. The cell-density default (10^5 or 10^6) is unresolved: S038 says 10^5 and tells users to switch to 10^6."
  - id: A163
    name: metabolite_analyzer_range_flags
    default: "analytical-range breach: blank value plus an error-log line '<analyte> Analytical Range High/Low'; process-range breach: status Low/High only"
    range: "n/a"
    unit: category
    grade: A
    sources: [S003, S004]
    notes: "Range n/a because this is a rule. The semantics are in the manual (sample type settings, page 3-48; error list, page 5-18) and in per-analyte error-status tags (S004). How a flag looks inside the exported CSV is not documented in what was read, so the CSV form is assumed. The limits that apply depend on the dilution ratio (A089, A090)."
  - id: A164
    name: metabolite_analyzer_reanalysis_rows
    default: "a reanalysis adds a new row with a new Date & Time and keeps the old time in Sample Time; cell-density images can be reanalysed within 30 days"
    range: "fixed"
    unit: d
    grade: S
    sources: [S003, S004]
    notes: "Manual page 2-19; the OPC modified time differs from the sample time after a reanalysis (S004). The 30 d window is the manual's own limit, so the range is fixed."
  - id: A165
    name: metabolite_analyzer_record_fields
    default: "sample id, sample type, operator, batch id, vessel id, cell type, vessel temperature 37 degC, vessel pressure 0 psi, sparging O2 20.9%, chemistry dilution, cell-density dilution, pre-dilution multiplier, tray location, time in tray, original sample time"
    range: "field set"
    unit: fields
    grade: S
    sources: [S003, S004]
    notes: "Screen field list on manual page 2-17 and the OPC start tags (S004). The dilution ratio options extend A089 and A090. Header spellings in an export file are A160."
  - id: A166
    name: cell_counter_csv_columns
    default: "Sample ID; counts; total and viable x10^6 cells/mL; viability %; diameter and circularity; cell type; diameter limits; dilution; analysis and reanalysis date/time and user; wash and mixing settings; tag"
    range: "32 headers in the fixture"
    unit: layout
    grade: P
    sources: [S086, S085, S084]
    notes: "The header list comes from a community fixture; the vendor tech note confirms the export types but defers the columns to an instructions-for-use manual that was not opened. In the fixture the timestamp is month/day/year 24 h without seconds and without a zone."
  - id: A167
    name: cell_counter_export_scope_and_append
    default: "one CSV per sample set; an optional append mode repeats earlier rows"
    range: "append on or off"
    unit: mode
    grade: S
    sources: [S084, S085]
    notes: "S085 warns that the append mode concatenates all data over time and can create repeated measures. The parser therefore needs an idempotent ingest."
  - id: A168
    name: cds_injection_peak_record
    default: "per injection: injection id and time, injection volume uL, sample name and id, operator, sequence name and line, method name and id, signal name; per peak: retention time s, area mAU*s, height mAU, area %, tailing, plates, resolution, amount with units"
    range: "template-driven column choice"
    unit: layout
    grade: P
    sources: [S088, S090, S091]
    notes: "Names and units are from a vendor mapping table (excerpt only); the amount flow is from the Empower guide. No vendor document shows a titer amount column, so that column is assumed. Both data system families export user-designed tables, so the dialect is a template."
  - id: A169
    name: cds_audit_and_version_fields
    default: "audit entries for injection, result set, sequence and method; user shown as 'Full Name (userid)'; a new result id per processing run"
    range: "n/a"
    unit: category
    grade: P
    sources: [S089, S090]
    notes: "Range n/a because this is a field list. The four audit scopes are from the Agilent article (excerpt); the result id per run is from the Waters tip (excerpt). A reason-for-change comment on reprocessing is assumed."
  - id: A170
    name: batch_procedural_hierarchy_and_phase_states
    default: "procedure > unit procedure > operation > phase; 13 phase states (idle, running, complete, pausing, paused, holding, held, restarting, stopping, stopped, aborting, aborted, resetting)"
    range: "fixed model"
    unit: model
    grade: P
    sources: [S093, S094, S051]
    notes: "From vendor guides and a documentation page, not from the standard text, which is paywalled. The state numbers are one vendor's and are not used. Batch list entry fields (batch id, lot id, campaign id, recipe id, requested and actual start and end, equipment) are the element names of the BatchML schema (S051)."
  - id: A171
    name: process_tag_roles_and_naming
    default: "<channel>.PV, .SP, .Out with the unit in the header; pH, DO, temperature, stirrer, gas flows, feed and base pumps, level and off-gas CO2 as channels"
    range: "naming grammar"
    unit: text
    grade: P
    sources: [S099, S101, S100]
    notes: "The role suffixes come from a third-party description of one vendor export (S101); the bench-controller manual puts the unit in parentheses in the variable name (S099). Two dialects exist and the simulator would use one."
  - id: A172
    name: controller_logging_deadband_and_max_interval
    default: "log a value when it changes by its deadband or when the maximum log interval has passed; manual example: 1 RPM deadband and 15 s maximum interval; the default deadband of the agitation PV is 0.5 RPM"
    range: "deadband per variable; interval 15 s up to minutes"
    unit: "RPM, s"
    grade: S
    range_grade: A
    sources: [S099]
    notes: "The mechanism, the example and the default deadband are in the manual (page 167, Appendix 4). The 15 s is the manual's worked example, not a stated default, and the setting is labelled in minutes while the example is in seconds. The range ends are not sourced. Defaults for the other tags and the 60-minute default maximum interval are A178 and A179."
  - id: A173
    name: historian_exception_compression_defaults
    default: "ExcDev 0.1% of span, ExcMax 600 s, CompDev 0.2% of span, CompMax 28800 s, span 100"
    range: "0 to 1% of span"
    unit: "% of span, s"
    grade: P
    range_grade: A
    sources: [S098]
    notes: "Generic historian defaults from training material (excerpt), not tuned for bioreactor tags. Used only if an optional historian stage is switched on."
  - id: A174
    name: alarm_state_model
    default: "ISA-18.2 states: normal, unacknowledged, acknowledged, return-to-normal unacknowledged, shelved, suppressed by design, out of service; acknowledge and return-to-normal are separate events"
    range: "fixed model"
    unit: model
    grade: P
    sources: [S095, S096, S097, S099]
    notes: "Alarm record fields follow OPC UA Part 9 names (severity, active, acknowledged, confirmed, comment). A bench controller manual records the acknowledging user and time of each alarm (S099)."
  - id: A175
    name: alarm_deadband_and_delay_starting_points
    default: "flow 5% and 15 s, level 5% and 60 s, pressure 2% and 15 s, temperature 1% and 60 s; pH and DO not given"
    range: "none stated"
    unit: "% of span, s"
    grade: P
    sources: [S096]
    notes: "Process-industry starting points from a vendor white paper (excerpt); values for pH and DO would be assumed."
  - id: A176
    name: contamination_response_delay_h
    default: "no default; a scenario input per scripted response step, printed with every result"
    range: "n/a"
    unit: h
    grade: A
    sources: [S065, S058]
    notes: "Range n/a because the value is a scenario input, not a parameter with a default (simulation_spec section 11.7). Two delays are meant: from the first process signal to the first scripted response (isolate the unit, stop feeds, draw confirming samples) and from a confirmed positive result to a hold or quarantine action on the affected lots. No source gives either delay. Direction only: containment after a suspected contamination is to isolate the bioreactor and stop feeds (S065), and the most used virus test takes at least two weeks, so material can move on downstream before a positive is known (S058). The delay is identical across architectures, so it changes how much material is touched before containment, not which architecture finds it. Sweep points for tests (for example 0 h, 24 h, 72 h) are a test design choice, not data. Withdrawal timing once a recall is decided is A187."
  - id: A177
    name: shared_lot_topology
    default: "no default; a scenario input giving, for each of seed lot, media lot and feed lot, how many reactors draw from it"
    range: "1 to the number of reactors (A001)"
    unit: reactors per lot
    grade: A
    sources: [S071, S049]
    notes: "No source gives how many reactors share a lot. The range ends are logical bounds: 1 means no sharing and the upper end is every reactor in the scenario (A001 sets 24 by default, range 5-100). Why it matters: the investigation walk-back extends to other reactors or batches that share a seed train, feed lot, media lot or equipment (A149), and the production record review rule extends an investigation to other batches associated with the failure (S071); 'seed train' is a term of the industrial biopharma ontology (S049). Sharing is also what scenario SC12 injects when an event enters through a shared medium lot (A157). The topology is a map from lot to reactors, set per scenario and printed with every result. Lot withdrawal timing is a separate gap and is not covered here."

  # ---------------- controller emitters (simulation_spec section 2.4.8) ----------------
  - id: A178
    name: controller_log_deadband_defaults
    default: "bench controller defaults, same on its two models: pH PV 0.05 pH and SP 0.01; DO PV 2.0 % and SP 1.0 %; temperature PV 0.2 C and SP 0.1 C; base pump duty 1.0 %; heat duty 2.0 %; main gas set flow 0.4 L/min on the 15-class model (2.0 on the larger one); agitation PV 0.5 RPM (A172). No row for the feed pump, the individual gas flows or an off-gas analyzer"
    range: "per variable, user-set; no range stated"
    unit: "pH, % DO, C, % duty, L/min"
    grade: S
    range_grade: A
    sources: [S099]
    notes: "Appendix 4 of the one public bench-controller manual gives a default deadband per logger variable and marks the ones recorded by default; pH, DO and temperature PV and SP, the base duty and the heat duty are marked, the individual gas flows are not (only raw valve voltages with a 0.1 V deadband exist). A tag without a row (feed pump, gas flows, off-gas CO2) has no sourced deadband; the nearest sourced fallback is the generic historian exception deviation of A173 (0.1 % of span, grade P, optional stage). Deadbands are the logging deadband, not the control deadband (A182) and not an alarm deadband (A185)."
  - id: A179
    name: controller_max_log_interval_min
    default: 60
    range: "user-set; the manual's worked example uses 15 s (A172); the generic historian exception maximum is 600 s (A173)"
    unit: min
    grade: S
    range_grade: A
    sources: [S099]
    notes: "System setting 'Max Data Log Interval (min)' has default 60 on both models and applies to every logged variable on top of its deadband: a value that never moves by its deadband is still logged once per interval. The unit is an interpretation: the setting is labelled in minutes, its global variable in ms, and the manual's chart example is in seconds, all with the same figure 60 in the two tables; minutes is taken because the setting's own label says so. With the A178 deadbands a flat tag therefore produces one row an hour, while a moving one produces rows at about the deadband steps."
  - id: A180
    name: gas_flow_capability_ranges
    default: "no operating default (gas names and flows are scenario data). Capability ranges: 15-class controller air and N2 100-2000 mL/min, O2 30-500, CO2 30-300; its larger model air, N2 and O2 300-10000, CO2 80-2000; mini cell-culture system (0.35 L vessels) total 0.04-5 sL/h (about 0.7-83 mL/min) and CO2 0.04-3.5 sL/h (about 0.7-58 mL/min)"
    range: [0.7, 10000]
    unit: mL/min
    grade: P
    sources: [S099, S104]
    notes: "These are mass flow controller capability ranges from two vendor specifications, not typical operating flows, and they bracket the 2-5 L bench class of the profiles rather than sit on it (no 2-5 L controller manual was opened); the vessel size of the 15-class model is not given in the text read, hence grade P. The bench controller lets the user set the total (main gas) flow manually, and the DO and pH loops set the share of each gas, so the individual flows are outputs (OUT); CO2 is pulsed at the controller minimum when the requested amount is below it. Minimum flows for the 15-class and the larger model: CO2 0.03 and 0.08, N2 and air 0.10 and 0.25, O2 0.03 and 0.30 L/min. Default main-gas alarm limits on the 15-class model: low-low 0.2, low 0.4, high 1.6, high-high 1.8 L/min. The mini system lists exhaust analysis as not offered for its cell-culture version (A183)."
  - id: A181
    name: pump_output_ranges
    default: "pump outputs are duty in % of full speed: base pump 0-100 % duty with a cap of 50 % in auto mode (100 % in manual); the maker advises limiting the range to the expected base use. Feed rate range of the mini system: 0.3-9.5 mL/h up to 13-420 mL/h depending on tube diameter"
    range: "0 to 100 % duty; 0.3 to 420 mL/h"
    unit: "% duty, mL/h"
    grade: P
    sources: [S099, S104]
    notes: "Media and the two addition pumps of the bench controller are variable-speed and one-directional, the sample pump is fixed-speed and two-directional; one addition pump must be chosen by the user as the base pump. The feed pump follows the scheduled feed events of the scenario, so its OUT is scenario data and only the logging deadband (A178) and the rate bounds here are needed. The two sources are different products and scales, so the pair is a proxy."
  - id: A182
    name: ph_do_controller_out_rule
    default: "two-sided control with an internal deadband: pH, CO2 flows only when pH PV is above SP + deadband and base is added only when PV is below SP - deadband, default pH deadband 0.02, allowed 0-0.05; DO, the N2 set point is DO SP + deadband and the O2 set point is DO SP - deadband, default deadband 1.0 % DO, allowed 0-5 %; base duty capped at 50 % in auto mode (A181)"
    range: "pH deadband 0-0.05; DO deadband 0-5 %"
    unit: "pH units, % DO"
    grade: S
    sources: [S099]
    notes: "Gives the simulator a generic rule for OUT (section 2.4.4): OUT is zero inside the deadband and rises outside it. PID gains and output limits exist in the manual and were not read, so the shape of the rise is the engine's choice. The pH part matches A095 (reconciled 2026-10-29)."
  - id: A183
    name: offgas_co2_range
    default: "no operating default; analyzer span 0-25 % CO2 by infrared, mass flow range 0-300 sL/h"
    range: [0, 25]
    unit: "% v/v"
    grade: P
    sources: [S105, S104]
    notes: "The span is that of one bench exhaust analyzer (O2 1-50 % or 0-100 % beside it) and is used as the plausible range of the signal, not as a typical value: no source states a typical exhaust CO2 of a mammalian culture. The only data in the opened note are plots of cell-free medium whose axes reach about 8 to 10 %, with no values in the text. The engine would compute the off-gas value from hidden state (section 2.4.4), so only the span and the physical bound 0-25 % are needed here. The mini cell-culture system offers no exhaust analysis, so the tag exists only on setups with a separate analyzer."
  - id: A184
    name: ph_do_temperature_alarm_limit_defaults
    default: "bench controller defaults, absolute values: pH low-low 7.10, low 7.15, high 7.25, high-high 7.30; DO low-low 30 %, low 40 %, high 60 %, high-high 70 %; temperature low-low 35 C, low 36 C, high 38 C, high-high 39 C"
    range: "user-defined (limits are entirely selectable)"
    unit: "pH, % DO, C"
    grade: S
    range_grade: A
    sources: [S099]
    notes: "Read from the process alarm table of the manual. The limits sit symmetrically around 7.20, 50 % and 37 C (windows of +/-0.05 and +/-0.10 pH, +/-10 and +/-20 % DO, +/-1 and +/-2 C, derived), but the manual states no default set point (recommended auto set points: pH 6.8-7.4, DO 25-100 %, temperature 37 C). The limits are absolute, not relative to the set point, so a scheduled temperature shift below 35 C would cross the low-low limit unless the scenario moves the limits too. The manual's state column labels low-low as an error and the others as warnings; only the limits are used here."
  - id: A185
    name: ph_do_alarm_deadband_and_delay
    default: "no default; not needed while only scheduled alarm events are rendered (simulation_spec section 2.4.3)"
    range: "n/a"
    unit: "pH units or % of span, s"
    grade: A
    sources: [S096, S099]
    notes: "Neither opened source gives an alarm deadband or on-delay for pH or DO: the bench controller's process alarm settings are limits only (plus a snooze time, A186), and the process-industry table of S096 (A175) lists flow, level, pressure and temperature. If a limit-based alarm rule is ever built, the nearest sourced row is the temperature row of A175 (1 % of span, 60 s, grade P for temperature) and the values for pH and DO stay assumed and printed as assumed."
  - id: A186
    name: alarm_acknowledge_response_time_s
    default: "operator response to an alarm about 49 s on average (upset conditions, simulator training in the process industry), about 1 min per alarm in a burst; an alarm acknowledged while its condition persists is raised again after the snooze time, default 300 s on the bench controller"
    range: "none stated"
    unit: s
    grade: P
    sources: [S106, S099]
    notes: "The 49 s comes from a human-performance study cited by S106 (video-recorded operators in simulator training under upset conditions), so it is a process-industry proxy and a response time, not a measured acknowledgement delay; no distribution for a bioprocess laboratory (night, unattended, one person for many reactors) was found, so a scenario that needs a long acknowledgement sets it as an input and prints it. The bench controller records the acknowledging user and time (A174) and, for audible alarms, silences the buzzer for the snooze time; the manual says an acknowledged alarm whose condition persists is regenerated after that time, which yields repeated alarm rows. Return-to-normal follows the process and has no parameter. Alarm volume check from EEMUA 191 as cited second-hand by S106: an average of less than 1 alarm per 10 minutes in steady state and fewer than 10 in the 10 minutes after an upset."
  - id: A187
    name: lot_withdrawal_schedule_h
    default: "no default; a scenario input per lot kind, printed with every result. Public reference points for withdrawing distributed batches once a recall is decided: Class 1 immediate action, Class 2 within 48 h, Class 3 within 5 d, given as advice on priority"
    range: [0, 120]
    unit: h
    grade: P
    sources: [S107, S108, S109, S071]
    notes: "UK finished-medicine recall classes (S107, S108) stand in for the schedule of SC12; they apply to distributed batches after a recall decision, not to pools or intermediates held in the plant, and the timescales are not legal deadlines (S108). Not found in any opened source: the delay from a confirmed positive to the recall decision and class, and how fast unreleased pools are put on hold (the hold delay stays A176). Related limits: a UK licence holder must inform the authority immediately of a defect that could lead to a recall and may be told to quarantine remaining stock during the investigation, with a final report within 12 weeks of the first (S108); for a distributed licensed biological product a deviation report is due as soon as possible and within 45 calendar days of learning of it (S109, a reporting limit, not a hold or withdrawal limit); the US production record review rule widens an investigation to other batches associated with the failure and sets no time limit (S071, text re-opened on the eCFR). Sweep points for tests (0 h, 48 h, 120 h) are a test design choice, not data."
  # ---------------- S1b inputs: process settings, clock times and caps (added 2026-10-29) ----------------
  - id: A188
    name: inoculation_stagger
    default: "day 0 is a Monday; 24 reactors in 4 cohorts of 6 consecutive reactors; cohort k (k = 0 to 3) is inoculated on day k; within a cohort one reactor every 15 min starting 08:00 (first 08:00, sixth 09:15); the production culture then runs per A004, so cohorts differ in age by whole days"
    range: "cohort interval 0 to 2 d; in-cohort interval 5 to 60 min; cohort size 1 to 24"
    unit: "d, min, reactors"
    grade: A
    sources: []
    notes: "Scenario setting, no source. Chosen so that on any day of weeks 2 and 3 the reactors are in different phases (feed trigger, temperature shift, harvest) instead of all reaching the glucose floor (A010) on one day, and so that every inoculation falls on a weekday (A201). Cohort size 6 is half a bay of 12 (A001); which cohort sits in which bay is the engine's choice. Cohort interval 0 gives the simultaneous start. Inoculation density A007, seed train A005."
  - id: A189
    name: scenario_horizon_days
    default: 21
    range: [14, 42]
    unit: d
    grade: A
    sources: []
    notes: "Scenario input, printed with every result. Three whole weeks, so the weekend rules (A201) apply twice. The last cohort starts on day 3 (A188) and a 14 d culture (A004) ends on day 17 (D); the remaining 4 d let the harvest-day analyses and the queue clear. Reactors that start on day 0 reach the harvest rule (A013) on day 14. No source."
  - id: A190
    name: initial_glucose_g_per_l
    default: 8
    range: [4, 15]
    unit: g/L
    grade: S
    range_grade: A
    sources: [S112, S113]
    notes: "The chemically defined growth medium of one fed-batch study contains 8 g/L glucose (S112), and the production cultures there start in it; the same study raised the initial glucose of seed-expansion and N-step cultures to 12 and 15 g/L (S112, the high end). Bioreactor glucose targets of 4.5-5.0 g/L in another study are a feed target, not an initial value (S113); the low end 4 is a round number near it and has no source. The inoculum is taken to carry no glucose of its own (assumption). Hand check with A007 (1.0e6 cells/mL), A080 (0.027 per h) and A082 (2.5 pmol/cell/d), pure exponential growth, no lag, no death, no Monod term: 8 g/L falls to the 1.0 g/L floor (A010) after 89 h, about day 3.7, at 11e6 cells/mL, so the first bolus (A050) is due around day 4 (D)."
  - id: A191
    name: initial_glutamine_mm
    default: 4
    range: [2, 8]
    unit: mM
    grade: S
    sources: [S112, S114, S113]
    notes: "Standard supplement of 4 mM L-glutamine in two studies (S112, S114); 0, 2, 4 and 8 mM were tested in S112 (the range ends 2 and 8; 0 is left out because it is the no-glutamine case) and 6 mM was used in S113. 4 mM is 0.58 g/L (146.14 g/mol, D). Uptake is A083; ammonium is not modelled. Glutamine in the bolus is A208."
  - id: A192
    name: feed_bolus_volume_fraction_pct
    default: 2.4
    range: [2, 20]
    unit: "% of current culture volume per bolus"
    grade: D
    sources: [S110, S112, S113, S111]
    notes: "Default derived from the glucose feed of S110: when glucose fell below 4 g/L, a 500 g/L stock raised it by 12 g/L, which is 12 / 500 = 2.4 % of the volume (D); with the stock concentration of A193 it gives a glucose rise of f x C / (1 + f) = 0.024 x 500 / 1.024 = 11.7 g/L on top of what is left (D). A nutrient feed is a different, larger bolus: 10 % of the volume daily from day 3 in the ambr15 and 2 L runs of S112 (4-16 % tested in flasks, 8 % best), one 20 % feed on day 3 in S110, 5 / 2 / 5 / 2 / 5 % every second day in S111, a fixed 2.5-2.9 % of final volume per day in S113. For those the glucose concentration of the feed is 60 g/L (A193), so the pair (f, C) must be set together; the glucose rise per bolus is what matters. The sourced feeds are daily or on a fixed schedule; here the trigger is the glucose rule (A050), so the number of boluses is an outcome. Each bolus adds f to the volume and dilutes cells and analytes by 1 / (1 + f). Usable glucose of the default bolus above the 1.0 g/L floor: (1 + 12.0) / 1.024 - 1.0 = 11.7 g/L, enough for 1.3 d at 20e6 cells/mL (A008; 9.0 g/L/d from A082, D) and 0.9 d at 30e6, so at the top of the density range a once-daily decision can leave a short gap near zero. The 2.4 % is the fixed bolus of a scripted feed (A102); a bolus decided by the rule of A050 is sized by that rule from the glucose, the viable density and the floor (A010), so its volume is an outcome and A192 does not apply to it."
  - id: A193
    name: feed_glucose_concentration_g_per_l
    default: 500
    range: [60, 500]
    unit: g/L
    grade: S
    sources: [S110, S112, S113]
    notes: "500 g/L glucose stock in S110; 450 g/L stock for extra glucose in the ambr15 runs of S112 and 400 g/L in S113; the nutrient feed of S112 contains 60 g/L (the low end). A pure glucose stock (400-500 g/L) goes with a volume fraction of 1-3 % (A192), a 60 g/L nutrient feed with 10 % (5.5 g/L rise to an empty culture, 0.1 x 60 / 1.1, D); mixing 500 g/L with 10 % would add 45 g/L and is not a sourced practice."
  - id: A194
    name: feed_window_clock
    default: "feed window 09:00-11:00 (2 h); the bolus of A050 is executed at 10:00, the decision time, using the newest glucose result available at 10:00; scenario-scripted feeds (A102, example 09:00) fall inside the window; a daily scheduled event (feed decision, temperature shift) runs at 10:00"
    range: "window 1 to 4 h around 10:00"
    unit: "clock time, h"
    grade: A
    sources: []
    notes: "Scenario setting, no source. The window contains both the 10:00 decision of A050 and the illustrative 09:00 bolus of the SC3 timeline (A102), so the two do not contradict each other: A102 is a scripted event, A050 the rule. The second sample of A015 is planned uniformly inside this window (A202). Bolus size A192, A193, A208. The decision input depends on the experiment: in experiment 1 (open loop) the truth run decides on the true glucose value, so recording cannot change the process; in experiment 2 (closed loop) it decides on the most recent recorded result (simulation_spec section 6)."
  - id: A195
    name: temperature_shift_schedule
    default: "37 C until culture day 4, then set point 33 C; applied as a step change of the set point at 10:00 on culture day 4 (day counted from the inoculation date, A188), the controller then moves PV with the lag of A199"
    range: "day 3 to 5 (day 5 assumed); set point 30 to 35 C; pre-shift 37 C"
    unit: "d, C"
    grade: S
    sources: [S110, S111, S113]
    notes: "Two studies shift on day 3 (to 35 or 33 C, S110) and on day 4 (to 30, 32 or 34 C, S111); a third shifts when a target density is reached, about 8-10e6 cells/mL, with the day and set points not stated (S113). The default day 4 and 33 C is a pick inside the two sourced sets and was not reported as such; the clock time 10:00 is a scenario setting (A194). Other studies of the same kind keep 37 C throughout (S112), so a no-shift scenario is also sourced. The effect on growth is A196. The absolute temperature alarm limits of A184 (low-low 35 C) would trip at 33 C; A197 makes them follow the set point."
  - id: A196
    name: temperature_shift_effect_multipliers
    default: "after the shift: maximum growth rate x 0.5 (A080), death rate x 0.5 (A081), specific productivity x 1.5 (A086); per-cell glucose, glutamine and lactate rates unchanged (A082, A083, A084); multipliers apply from the shift instant"
    range: "growth x 0.2 to 1.0; death x 0.3 to 1.0; productivity x 1.0 to 2.0"
    unit: "multiplier (dimensionless)"
    grade: A
    sources: [S115, S116]
    notes: "Scenario knob, assumed. The sources show direction and spread, not rate multipliers: cooling to 32 C arrested growth and prolonged viability, the titer ratio against 37 C ranged 0.30-0.91 for four clones and about 5 for two others, transient cultures had at least 10-fold lower viable density (S115), and one study reports 2.3 times the final antibody at 31 C (S116, snippet, cell-line specific). The defaults are chosen so that the peak viable density falls and viability lasts longer, the common outcome; they are not fitted. A scenario without a shift sets all three to 1."
  - id: A197
    name: process_alarm_schedule_default
    default: "no alarm events scripted in the base scenarios (an alarm event exists only when a scenario adds one); alarm limits are relative to the set point: pH SP -0.10 / -0.05 / +0.05 / +0.10 (low-low, low, high, high-high), DO SP -20 / -10 / +10 / +20 % air saturation, temperature SP -2 / -1 / +1 / +2 C, so the set points of A198 and the scheduled shift (A195) raise no alarm"
    range: "n/a"
    unit: "schedule; pH units, % air saturation, C"
    grade: A
    sources: [S099]
    notes: "Range n/a because this is a schedule. The offsets are the windows derived in A184 from the bench controller's default limits, which are absolute and centred on 7.20, 50 % and 37 C; with the set points of A198 (pH 7.00, DO 30 %) or after the shift (33 C) absolute limits would sit on the set point or alarm at once, so they are expressed relative to it here. The simulation spec renders only scheduled alarm events (section 2.4.3); alarm volume and acknowledgement are A186."
  - id: A198
    name: online_sensor_signals_and_setpoints
    default: "three signals on every reactor, each with roles PV, SP and OUT: pH, DO, temperature; tag = unit_tag.signal.role, for example U03.pH.PV, U03.DO.SP, U03.temperature.OUT; set points pH 7.00 (deadband A182), DO 30 % air saturation, temperature 37 C then 33 C (A195); cadence A100 (60 s); other signals (agitation, gas flows, pumps, off-gas CO2) are absent unless a scenario adds them (A178 to A183)"
    range: "pH 6.8 to 7.4; DO 25 to 100 %; temperature 30 to 37 C"
    unit: "pH, % air saturation, C"
    grade: S
    sources: [S110, S099]
    notes: "S110 gives, for its microscale vessels, 37 C, DO 30 % of air saturation, base added below pH 6.97 and CO2 sparged above 7.05 towards a target of 7.0. The ranges are the recommended auto set points of the bench controller manual (S099, as in A184) and the shift range of A195. Volume with the raw layer on: 24 units x 3 signals x 3 roles x 1,440 ticks per day = 311,040 values per day, 6.5 million over the 21 d horizon (A189, D), before the deadband logging of A178 thins what a historian keeps. Layer off: PV series only, plain tags without the role (data model, tag naming convention)."
  - id: A199
    name: online_sensor_noise_and_lag
    default: "PV noise, normal and independent per tick: pH sd 0.005, DO sd 0.2 % air saturation, temperature sd 0.02 C; temperature PV follows a changed SP with a first-order lag, time constant 20 min; pH and DO PV follow the truth series without lag"
    range: "sd up to a third of the log deadband (pH 0.017, DO 0.67 %, temperature 0.07 C); lag 5 to 60 min"
    unit: "pH units, % air saturation, C, min"
    grade: A
    sources: [S099]
    notes: "No probe accuracy figure was opened. The sd values are one tenth of the default log deadbands of the bench controller (pH 0.05, DO 2 %, temperature 0.2 C; A178, S099), so noise alone, at 3 sd = 0.3 of a deadband, does not trigger deadband logging; the choice is not data. The lag is an assumption for a 2 L vessel with a heating and cooling jacket."
  - id: A200
    name: kinetics_integration_step_s
    default: 60
    range: [10, 600]
    unit: s
    grade: A
    sources: []
    notes: "Design setting. Equal to the sensor cadence of A100, which already fixes the step in its notes (DRY: the value is the same fact; this entry gives the engine one named parameter, and if the two are ever split, A100 is the cadence and this entry the step). One explicit Euler step per sensor tick is adequate: the fastest rate in the model, growth 0.027 per h (A080), changes a state by 0.027 / 60 = 0.045 % per step (D). All scheduled events (A188, A194, A195, A204, A205) fall on whole minutes, so no event time is rounded."
  - id: A201
    name: shift_roster_clock
    default: "weekdays: two shifts, 08:00-13:00 and 13:00-18:00 (staffed window 10 h, A098), 2 operators per shift; weekends: one shift 08:00-14:00 (6 h), 1 operator, and no second sample (A015 share 0); sampling and analysis happen only inside the staffed window; no night shift"
    range: "n/a"
    unit: "schedule; clock time, operators"
    grade: A
    sources: []
    notes: "Range n/a because this is a schedule. Scenario setting, no source; it turns the 'reduced staffing at weekends' of A017 into numbers. The 10 h window and 2 operators are A098; the burst of A016 at 08:30 sits 30 min after the shift start. State the window wherever utilisation appears (A074: a 6 h weekend window raises it by a factor of 10 / 6 for the same load). Day 0 is a Monday (A188)."
  - id: A202
    name: first_sample_nonburst_distribution
    default: "the burst share of A016 (65 %, 08:30, sd 18 min) applies to the first, daily sample of each reactor; the other 35 % of first samples are planned uniformly over the staffed window of that day (08:00-18:00 weekdays, 08:00-14:00 weekends); the second sample (A015) is planned uniformly inside the feed window (A194); the draw delay spread of A063 is added to every planned time and a draw is clipped to the staffed window"
    range: "burst share 0 to 1 (A016 sets 0.65); the rest uniform"
    unit: "schedule; fraction"
    grade: A
    sources: []
    notes: "Scenario setting, no source. A016 says '65% of samples'; this entry reads it as 65 % of the first samples so that the second samples have their own rule. A burst draw before the window start (the normal curve reaches 07:54 at 2 sd) is clipped to 08:00."
  - id: A203
    name: staggered_sampling_window
    default: "SC2 staggered arm: one window per bay of 12 (A001); bay 1 08:00-08:45, bay 2 08:45-09:30 (width 45 min, offset 45 min); the 12 reactors of a bay are planned evenly, reactor j at start + (j + 0.5) x 45 / 12 min (every 3.75 min); replaces the burst of A016 for first samples in that arm; second samples and weekend rules unchanged"
    range: "width 15 to 240 min; offset 0 to 240 min"
    unit: min
    grade: A
    sources: []
    notes: "Scenario setting, no source. Both windows end at 09:30 so the last result can still reach the 10:00 decision (A050, A206): 09:30 plus transport of 10-25 min (A018) plus one 4.5 min run (A023) is about 09:59 without queueing. The burst it is compared with has 95 % of its draws within 07:54-09:06 (A016, 2 sd). Even spacing of 3.75 min is below the 4.5 min service time of one analyzer and above the 2.25 min of two, so the comparison is about queueing and holding time, not about capacity."
  - id: A204
    name: qc_window_clock_and_length
    default: "one QC run of 30 min per analyzer per day at 08:00-08:30 (the start of the staffed window), weekdays and weekends; the analyzer is unavailable in that window; the failure probability per QC run is A087"
    range: "length 15 to 60 min"
    unit: "clock time, min"
    grade: A
    sources: []
    notes: "Scenario setting, no source for the length or the time (A031). Placed before the first burst arrivals (about 08:40-09:00 after A018) so the QC does not collide with the burst in the base scenarios; SC5 starts its maintenance when the QC window ends (A205)."
  - id: A205
    name: sc5_maintenance_start
    default: "maintenance on analyzer AN-1 starts at 08:30 on one weekday (SC5 default: day 8, a Tuesday), length A096 (4 h), so the window is 08:30-12:30; it begins when the daily QC window ends (A204), so the two never overlap; AN-2 stays up"
    range: "start 08:00 to 14:00; length per A096 (1 to 8 h)"
    unit: "clock time, h"
    grade: A
    sources: []
    notes: "Scenario setting, no source (A031, A096). The window covers the burst of A016 and the 10:00 decision of A050, which is what SC5 asks about (availability before the decision deadline). Day 8 is chosen so that all four cohorts (A188) are in production and past the temperature shift (A195)."
  - id: A206
    name: edf_deadline_rule
    default: "deadline of an analysis request = the first 10:00 clock time at or after its draw time, so 10:00 the same day for a draw before 10:00 and 10:00 the next day for a later draw; ties broken by arrival at the analyzer; the SLA variant of A035 uses draw time + A097 (30 min) instead"
    range: "n/a"
    unit: "rule; clock time"
    grade: A
    sources: []
    notes: "Range n/a because this is a rule. Ties the earliest-deadline-first policy of A035 to the 10:00 feed decision of A050, which is also the 'decision time' of the availability metric (spec section 8), so the queue rule and the metric use the same clock. Draws in the feed window after 10:00 (A194) therefore get the lowest urgency, which is the intended consequence of the rule and not a source-based choice."
  - id: A207
    name: cumulative_sample_volume_cap_pct
    default: 33
    range: [10, 50]
    unit: "% of initial working volume, cumulative per reactor"
    grade: A
    sources: [S011, S110]
    notes: "Scenario setting, not sourced: no page giving a percentage cap on sampling was found in searches of vendor and journal pages. Reference points: the micro-scale class has a recommended working volume of 10-15 mL, and the source says volume in that class can fall because of sampling, with more gas sparging, foaming and harder oxygen control as the effect (S011); a vessel started at 15 mL can lose 5 mL, 33 %, before it leaves the class (D, (15 - 10) / 15; reading the lower bound of the class as a floor is the assumption). A small-scale study took 200-350 uL for the cell count and 900 uL for the offline analyses per sample from 14 mL vessels (S110), 7.9-8.9 % of the vessel per sample set (D; the number of sample sets is not stated). The cap counts sampled volume only, with the shares of A057, and does not net feed additions. Effect on the defaults: bench (0.014 % per sample) never reaches it (about 22 draws = 0.3 %, D), mini (0.31 %) needs about 106 draws, micro (4.8 %) is cut off after 6 draws (6 x 4.8 = 28.8 %; a 7th would reach 33.6 %), so a daily-sampled micro culture loses every draw from about day 7 on."
  - id: A208
    name: feed_glutamine_concentration_mm
    default: 200
    range: [0, 200]
    unit: mM
    grade: A
    sources: []
    notes: "Scenario setting, no source. Glutamine at 4 mM (A191) would be used up within about a day at 10e6 cells/mL (11.8 mmol/L/d from A083, D), so a bolus without glutamine leaves the analyte at zero for most of the run. 200 mM is the usual concentration of commercial L-glutamine stock solutions (common knowledge, no source opened); with the default bolus of 2.4 % (A192) it adds 0.024 x 200 / 1.024 = 4.7 mM (D), about the initial level. Glutamine-free feeds (glutamine-synthetase lines) are the 0 end."

  - id: A209
    name: initial_lactate_g_per_l
    default: 0.0
    range: [0.0, 0.5]
    unit: g/L
    grade: A
    sources: []
    notes: "Scenario setting: fresh medium at inoculation is taken as lactate-free; the inoculum may carry a little lactate over, hence the small range. Used by the L1 process model in S1b."
  - id: A210
    name: initial_titer_g_per_l
    default: 0.0
    range: [0.0, 0.05]
    unit: g/L
    grade: A
    sources: []
    notes: "Scenario setting: product concentration at inoculation is taken as zero (carry-over from the seed culture is negligible at the inoculation ratio). Used by the L1 process model in S1b."
  - id: A211
    name: initial_viability_pct
    default: 97
