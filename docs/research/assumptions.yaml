    notes: "Range n/a because the default already states the span. Second-hand (snippet): supernatant spun down before Protein A UPLC titer; the page could not be read."
  - id: A118
    name: flex2_ols_sample_volume_ml
    default: 5.6
    range: "fixed"
    unit: mL
