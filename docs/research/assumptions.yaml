    notes: "Scenario setting for viability at inoculation (a healthy seed culture). Not taken from a source; shown as an assumption wherever it appears. Used by the L1 process model in S1b."

  - id: A212
    name: cho_early_death_rate_per_h
    default: 0.0013
    range: [0.0010, 0.0016]
    unit: "1/h"
    grade: S
    sources: [S118]
    notes: "kd_min of the engine (A011): the death rate of a culture that grows freely. One industrial CHO fed-batch culture (2 L, 37 C): the death rate was approximately constant up to 180 h at 1.3 +/- 0.3e-3 per h when lysis is taken into account, which is 0.031 per day (S118, D: x 24); the range is that spread. One culture only, and its pH set point was chosen so that lysis shows with higher effect strength (S118, section 2.1), so the value comes from conditions designed to show lysis and is not a typical figure. The value is from section 3.2 of S118 (lysis taken into account, approximately constant up to 180 h); the highest observed value was 5.5e-3 per h. Section 3.3 reports that the rise of the death rate after 120 h correlated with the declining growth rate; it gives no function, and the lysis-corrected rate of section 3.2 stays approximately constant up to 180 h, so the sentence is not support for the coupling, which is unsourced (A011, grade A). The counterpart for fully limited growth is A081."
