    notes: "Range n/a because this is a description per class. Liquid-handler sampling for the parallel systems (S009, S010); closed tempered container for pH and CO2 samples at 2 L and sterile syringe at 250 L (S013); syringes limit gas exchange better than bags (S016). The container effect on pH is A037."
  - id: A114
    name: mini_parallel_working_volume_ml
