    unit: mL
    grade: S
    sources: [S010, S011]
    notes: "Recommended working volume of an Ambr 15 class system (S010); 10-15 mL (S011)."
  - id: A111
    name: micro_parallel_vessel_count
    default: 24
    range: [24, 48]
    unit: vessels
    grade: S
    sources: [S010]
    notes: "24 or 48 parallel cultivations (S010)."
  - id: A112
    name: micro_parallel_sample_volume_ul
    default: 600
    range: "fixed"
    unit: uL
    grade: S
    sources: [S011]
    notes: "Typical sample volume of such systems, a burden for daily sampling at 10-15 mL (S011). Volumes when an analyzer is coupled to the system are in A020 and are not added to this figure."
  - id: A113
    name: sampling_method_by_class
    default: "micro and mini parallel: automated liquid handler into a cup; bench: manual draw into a closed tempered container or syringe; pilot: sterile syringe from a sampling line"
    range: "n/a"
