    notes: "Full test menu: glucose, lactate, glutamine, glutamate, ammonium, sodium, potassium, calcium, pH, pCO2, pO2, total and viable cell density, viability, cell diameter and osmolality (S001)."
  - id: A117
    name: hplc_supernatant_prep
    default: "centrifuge 500-1000 g for 5-10 min"
    range: "n/a"
